packages:
  - packages/*
  - apps/*
  - e2e
  - examples/*
allowBuilds:
  "@parcel/watcher": false
  esbuild: true
overrides:
  # Security fix (GHSA: glob AbortSignal bypass, minimatch ReDoS). Storybook's docgen plugin
  # still pins glob ^13 upstream; remove once @storybook/react-vite ships a fixed version.
  "@joshwooding/vite-plugin-react-docgen-typescript>glob": "14.0.3"
  # Release age (dev deps ≥ 14 days): @storybook/addon-mcp 10.6.3 resolves tmcp 1.20.1 and
  # @tmcp/adapter-valibot 0.1.7 (both 2026-10-26). Remove both lines after 2026-11-09.
  "@storybook/addon-mcp>tmcp": "1.20.0"
  "@storybook/addon-mcp>@tmcp/adapter-valibot": "0.1.6"
  # Release age (deps ≥ 14 days): Tiptap 3.32.0 (Editor, ADR-0023) resolves ProseMirror releases
  # from 2026-10-30 to 2026-11-04 (view and transform also through the other prosemirror-* packages).
  # Remove these four lines after 2026-11-18.
  "prosemirror-view": "1.42.8"
  "prosemirror-transform": "1.12.4"
  "@tiptap/pm>prosemirror-changeset": "2.4.4"
  "@tiptap/pm>prosemirror-schema-list": "1.5.1"
  # Security fix (GHSA-cg2g-xh64-v4q7, GHSA-mrv2-3pqr-j5jr): monaco-editor 0.57.0 (Code editor,
  # ADR-0034) pins dompurify 3.4.15. Its ESM build vendors its own copy and uses neither
  # SAFE_FOR_TEMPLATES nor IN_PLACE. Remove once monaco-editor depends on dompurify >= 3.4.17.
  "monaco-editor>dompurify": "3.4.17"
