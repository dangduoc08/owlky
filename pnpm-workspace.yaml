packages:
  - packages/*
  - apps/*
  - e2e
  - examples/*
allowBuilds:
  "@parcel/watcher": false
  esbuild: true
overrides:
  # Security fix (GHSA-67mh-4wv8-2f99, esbuild <= 0.24.2 dev server): drizzle-kit (a website dev
  # dependency) loads its config through @esbuild-kit, which pins esbuild 0.18.
  "@esbuild-kit/core-utils>esbuild": "0.25.12"
  # Security fix (GHSA: glob AbortSignal bypass, minimatch ReDoS). Storybook's docgen plugin
  # still pins glob ^13 upstream; remove once @storybook/react-vite ships a fixed version.
  "@joshwooding/vite-plugin-react-docgen-typescript>glob": "14.0.3"
  # Release age (dev deps ≥ 14 days): @storybook/addon-mcp 10.6.3 resolves tmcp 1.20.1 and
  # @tmcp/adapter-valibot 0.1.7 (both 2026-10-26). Remove both lines after 2026-11-09.
  "@storybook/addon-mcp>tmcp": "1.20.0"
  "@storybook/addon-mcp>@tmcp/adapter-valibot": "0.1.6"
  # Release age (deps ≥ 14 days): Tiptap 3.32.0 (Editor, ADR-0023) resolves ProseMirror releases
  # from 2026-10-30 to 2026-11-04 (view and transform also through the other prosemirror-* packages).
  # Remove these four lines after 2026-11-18.
  "prosemirror-view": "1.42.8"
  "prosemirror-transform": "1.12.4"
  "@tiptap/pm>prosemirror-changeset": "2.4.4"
  "@tiptap/pm>prosemirror-schema-list": "1.5.1"
  # Security fix (GHSA-cg2g-xh64-v4q7, GHSA-mrv2-3pqr-j5jr): monaco-editor 0.57.0 (Code editor,
  # ADR-0034) pins dompurify 3.4.15. Its ESM build vendors its own copy and uses neither
  # SAFE_FOR_TEMPLATES nor IN_PLACE. Remove once monaco-editor depends on dompurify >= 3.4.17.
  "monaco-editor>dompurify": "3.4.17"
  # Release age (deps ≥ 14 days): maplibre-gl 6.16.0 (Map, ADR-0025) resolves its style spec
  # 26.5.1 (2026-11-01). Remove after 2026-11-15.
  "maplibre-gl>@maplibre/maplibre-gl-style-spec": "26.4.4"
  # Release age (deps ≥ 14 days): the Markdown pipeline (ADR-0035: remark-gfm 4.0.1, rehype-raw
  # 7.0.0) resolves releases from 2026-10-29 to 2026-11-07 (hast-util-raw 9.2.0 also moves to
  # parse5 8 and entities 9). Only the Markdown dependencies use these packages. Remove these nine
  # lines after 2026-11-21.
  "rehype-raw>hast-util-raw": "9.1.0"
  "hast-util-raw>hast-util-from-parse5": "8.0.3"
  "hast-util-from-parse5>hastscript": "9.0.1"
  "mdast-util-gfm>mdast-util-gfm-autolink-literal": "2.0.1"
  "mdast-util-gfm>mdast-util-gfm-table": "2.0.0"
  "mdast-util-gfm>mdast-util-gfm-task-list-item": "2.0.0"
  "mdast-util-gfm-table>markdown-table": "3.0.4"
  "mdast-util-to-markdown": "2.2.0"
  "vfile-location": "5.0.3"
  "vfile-message": "4.0.3"
  # Release age (deps ≥ 14 days): @modelcontextprotocol/sdk 1.32.2 (@owlky/mcp-server, ADR-0071) resolves
  # releases from 2026-10-28 to 2026-11-07 for its HTTP server libraries. Only
  # the MCP server uses these packages. Remove these seven lines after 2026-11-21.
  # Security fixes (GHSA-3gg2-335m-rxc6 and the other hono advisories of 2026-11) move hono and
  # @hono/node-server to their first fixed releases (younger than 14 days, allowed for security
  # fixes). The website uses the SDK's web-standard transport, which reaches neither.
  "@modelcontextprotocol/sdk>@hono/node-server": "2.1.6"
  "@modelcontextprotocol/sdk>hono": "4.13.16"
  "@modelcontextprotocol/sdk>jose": "6.2.13"
  "@modelcontextprotocol/sdk>express-rate-limit": "8.7.1"
  "express-rate-limit>ip-address": "10.7.5"
  "encodeurl": "2.0.0"
  "qs": "6.16.1"
  # Release age (dev deps ≥ 14 days): shiki 4.5.0 (website code blocks, ADR-0040) resolves
  # hast-util-to-html 9.0.6 (2026-10-29). Only the website uses it. Remove after 2026-11-12.
  "@shikijs/core>hast-util-to-html": "9.0.5"
