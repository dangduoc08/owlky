name: CI

# Checks only — never publishes. Runs on pull requests and pushes to main, and is reused by
# release.yml before publishing a release tag.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, build, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm lint
      # Build first: workspace packages resolve each other's types from dist.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm check:boundaries
      - run: pnpm check:size
      - run: pnpm check:packages
      - run: pnpm check:specs
      # The MCP server's manifest (ADR-0046) must match the code, and its tarball must start.
      - run: pnpm check:manifest
      - run: pnpm smoke:mcp
      # Headless Firefox has no WebGL without a display (the Map needs it): run under Xvfb, which
      # `playwright install --with-deps` installs.
      - run: xvfb-run -a pnpm test
        env:
          VITEST_BROWSERS: chromium,firefox,webkit

  e2e:
    name: E2E (${{ matrix.project }} ${{ matrix.shard }})
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    env:
      # Firefox refuses to start when $HOME isn't owned by the user (root in this container).
      HOME: /root
    strategy:
      fail-fast: false
      # Chromium and mobile run most tests (responsive specs, touch): one runner each starved and
      # lost contact after an hour, so they run in three shards.
      matrix:
        include:
          - { project: chromium, shard: 1/3 }
          - { project: chromium, shard: 2/3 }
          - { project: chromium, shard: 3/3 }
          - { project: firefox, shard: 1/1 }
          - { project: webkit, shard: 1/1 }
          - { project: mobile, shard: 1/3 }
          - { project: mobile, shard: 2/3 }
          - { project: mobile, shard: 3/3 }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm storybook:build
      # Xvfb (in the Playwright image) gives headless Firefox WebGL for the Map.
      - run: xvfb-run -a pnpm --filter @owlky/e2e exec playwright test --grep-invert @visual --project ${{ matrix.project }} --shard ${{ matrix.shard }}
      # Visual regression runs once baselines are committed (generated in Docker: pnpm test:visual:update).
      - if: matrix.project == 'chromium' && matrix.shard == '1/3' && hashFiles('e2e/tests/__screenshots__/**') != ''
        run: pnpm --filter @owlky/e2e exec playwright test --grep @visual --project chromium
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}-${{ strategy.job-index }}
          path: e2e/playwright-report
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
