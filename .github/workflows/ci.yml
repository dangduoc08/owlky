name: CI

# Checks only — never publishes. Runs on pull requests and pushes to main, and is reused by
# release.yml before publishing a release tag.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, build, checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Build first: workspace packages resolve each other's types from dist.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm check:boundaries
      # Per-component entries (ADR-0068) are generated from the barrels and must be current.
      - run: pnpm check:entries
      # Gzip budgets per file, lazy module and scenario (React builds and CDN pages, ADR-0068).
      - run: pnpm check:size
      - run: pnpm check:packages
      # Every third-party package bundled into a published dist has a notice and an allowed license.
      - run: pnpm check:licenses
      - run: pnpm check:specs
      # The API reference (ADR-0049) must match the code; the docs examples must work as written.
      - run: pnpm check:api
      - run: pnpm check:docs
      # The MCP manifest (ADR-0071) must match the code.
      - run: pnpm check:manifest
      # Node-only unit tests (tokens, styles, mcp, and the website's server code with PGlite and the
      # mock OAuth providers) run here once; the browser projects run in the unit jobs below.
      - run: pnpm test:node

  # Browser unit tests (core, react, html): one runner per browser. A single runner with all
  # three browsers (about 15,000 tests) ran out of memory and crashed a page. Each job builds on
  # its own instead of downloading the build from `check`: the build takes well under a minute,
  # while the dist folders weigh about 45 MB and waiting for `check` would serialize the jobs.
  unit:
    name: Unit (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      # Tests load the built CSS and resolve workspace packages from dist.
      - run: pnpm build
      # Headless Firefox has no WebGL without a display (the Map needs it): run under Xvfb, which
      # `playwright install --with-deps` installs.
      - run: xvfb-run -a pnpm test:browser
        env:
          VITEST_BROWSERS: ${{ matrix.browser }}

  e2e:
    name: E2E (${{ matrix.project }} ${{ matrix.shard }})
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    env:
      # Firefox refuses to start when $HOME isn't owned by the user (root in this container).
      HOME: /root
    strategy:
      fail-fast: false
      # Chromium and mobile run most tests (responsive specs, touch): one runner each starved and
      # lost contact after an hour, so they run in three shards. Firefox and WebKit run in two
      # (one shard took about 50 minutes and became the slowest job).
      matrix:
        include:
          - { project: chromium, shard: 1/3 }
          - { project: chromium, shard: 2/3 }
          - { project: chromium, shard: 3/3 }
          - { project: firefox, shard: 1/2 }
          - { project: firefox, shard: 2/2 }
          - { project: webkit, shard: 1/2 }
          - { project: webkit, shard: 2/2 }
          - { project: mobile, shard: 1/3 }
          - { project: mobile, shard: 2/3 }
          - { project: mobile, shard: 3/3 }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm storybook:build
      # Xvfb (in the Playwright image) gives headless Firefox WebGL for the Map.
      - run: xvfb-run -a pnpm --filter @owlky/e2e exec playwright test --grep-invert @visual --project ${{ matrix.project }} --shard ${{ matrix.shard }}
      # Visual regression runs once baselines are committed (generated in Docker: pnpm test:visual:update).
      - if: matrix.project == 'chromium' && matrix.shard == '1/3' && hashFiles('e2e/tests/__screenshots__/**') != ''
        run: pnpm --filter @owlky/e2e exec playwright test --grep @visual --project chromium
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}-${{ strategy.job-index }}
          path: e2e/playwright-report
          retention-days: 7

  website:
    name: Website (${{ matrix.project }})
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    env:
      HOME: /root
      NEXT_TELEMETRY_DISABLED: "1"
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The website consumes the packages' dist (ADR-0040), then builds (static pages plus the
      # account and MCP routes, ADR-0071). Tests run it with PGlite and the mock OAuth providers.
      - run: pnpm build
      - run: pnpm website:build
      - run: pnpm --filter @owlky/e2e exec playwright test -c website.config.ts --project ${{ matrix.project }}
      # The remote MCP over HTTP: discovery, sign-in, tokens, OAuth with PKCE, tools (no secrets).
      - if: matrix.project == 'chromium'
        run: pnpm --filter @owlky/website smoke:mcp
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-website-${{ matrix.project }}
          path: e2e/playwright-report
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
