name: CI

# Checks only — never publishes. Runs on pull requests and pushes to main, and is reused by
# release.yml before publishing a release tag.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, build, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm lint
      # Build first: workspace packages resolve each other's types from dist.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm check:boundaries
      - run: pnpm check:size
      - run: pnpm check:packages
      - run: pnpm test
        env:
          VITEST_BROWSERS: chromium,firefox,webkit

  e2e:
    name: E2E (${{ matrix.project }})
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    env:
      # Firefox refuses to start when $HOME isn't owned by the user (root in this container).
      HOME: /root
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm storybook:build
      - run: pnpm --filter @minimal-tailwind/e2e exec playwright test --grep-invert @visual --project ${{ matrix.project }}
      # Visual regression runs once baselines are committed (generated in Docker: pnpm test:visual:update).
      - if: matrix.project == 'chromium' && hashFiles('e2e/tests/__screenshots__/**') != ''
        run: pnpm --filter @minimal-tailwind/e2e exec playwright test --grep @visual --project chromium
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: e2e/playwright-report
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
