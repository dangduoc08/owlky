<div class="sb-date-pickers">
  <div data-ok-date-picker data-ok-picker-variant="desktop" data-ok-orientation="portrait" data-ok-value-type="time">
    <div data-ok-text-field data-ok-variant="outlined" data-ok-size="medium" data-ok-color="default" data-ok-margin="none" data-ok-shrink data-ok-date-field data-ok-format-density="dense" data-ok-value-type="time" data-ok-value="09:30:00" data-ok-format="hh:mm A">
      <label data-ok-text-field-label id="custom-analog-label" for="custom-analog">Analog clock on desktop</label>
      <div data-ok-text-field-control>
        <div id="custom-analog" role="group" data-ok-text-field-input data-ok-date-field-sections aria-labelledby="custom-analog-label">
          <span data-ok-date-field-section>
            <span data-ok-date-field-content data-ok-section="hours" role="spinbutton" aria-label="Hours" aria-valuenow="9" aria-valuemin="1" aria-valuemax="12" aria-valuetext="09" tabindex="0" contenteditable="true" inputmode="numeric" spellcheck="false" autocapitalize="off" autocorrect="off" enterkeyhint="next">09</span>
            <span data-ok-date-field-separator>:</span>
          </span>
          <span data-ok-date-field-section>
            <span data-ok-date-field-content data-ok-section="minutes" role="spinbutton" aria-label="Minutes" aria-valuenow="30" aria-valuemin="0" aria-valuemax="59" aria-valuetext="30" tabindex="-1" contenteditable="true" inputmode="numeric" spellcheck="false" autocapitalize="off" autocorrect="off" enterkeyhint="next">30</span>
            <span data-ok-date-field-separator> </span>
          </span>
          <span data-ok-date-field-section>
            <span data-ok-date-field-content data-ok-section="meridiem" role="spinbutton" aria-label="Meridiem" aria-valuenow="0" aria-valuemin="0" aria-valuemax="1" aria-valuetext="AM" tabindex="-1" contenteditable="true" inputmode="text" spellcheck="false" autocapitalize="off" autocorrect="off" enterkeyhint="done">AM</span>
          </span>
        </div>
        <input type="hidden" data-ok-date-field-input value="09:30:00">
        <span data-ok-text-field-adornment="end">
          <button type="button" data-ok-icon-button data-ok-color="default" data-ok-size="md" data-ok-edge="end" data-ok-date-picker-open aria-label="Choose time, selected time is 09:30 AM" aria-haspopup="dialog">
            <svg data-ok-icon="clock-circle-linear" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-linecap="round"><circle cx="12" cy="12" r="10"></circle><path stroke-linejoin="round" d="M12 8V12L14.5 14.5"></path></svg>
          </button>
        </span>
        <fieldset data-ok-text-field-outline aria-hidden="true">
          <legend>
            <span>Analog clock on desktop</span>
          </legend>
        </fieldset>
      </div>
    </div>
    <div popover="manual" data-ok-popover data-ok-paper data-ok-placement="bottom-start" data-ok-disable-auto-focus role="dialog" aria-label="Select time" data-ok-date-picker-paper>
      <span data-ok-popover-arrow aria-hidden="true"></span>
      <div data-ok-picker-layout data-ok-orientation="portrait">
        <div data-ok-picker-content>
          <div id="custom-analog-clock" data-ok-time-clock data-ok-ampm="true" data-ok-value="09:30:00" data-ok-view="hours" data-ok-views="hours minutes">
            <div data-ok-time-clock-dial>
              <span data-ok-time-clock-pin></span>
              <span data-ok-time-clock-pointer></span>
              <div role="listbox" data-ok-time-clock-options tabindex="0" aria-label="Select hours. Selected time is 09:30 AM" aria-activedescendant="custom-analog-clock-hours-9">
                <span id="custom-analog-clock-hours-1" role="option" data-ok-time-clock-number data-ok-position="1" data-ok-value="1" aria-label="1 hours">1</span>
                <span id="custom-analog-clock-hours-2" role="option" data-ok-time-clock-number data-ok-position="2" data-ok-value="2" aria-label="2 hours">2</span>
                <span id="custom-analog-clock-hours-3" role="option" data-ok-time-clock-number data-ok-position="3" data-ok-value="3" aria-label="3 hours">3</span>
                <span id="custom-analog-clock-hours-4" role="option" data-ok-time-clock-number data-ok-position="4" data-ok-value="4" aria-label="4 hours">4</span>
                <span id="custom-analog-clock-hours-5" role="option" data-ok-time-clock-number data-ok-position="5" data-ok-value="5" aria-label="5 hours">5</span>
                <span id="custom-analog-clock-hours-6" role="option" data-ok-time-clock-number data-ok-position="6" data-ok-value="6" aria-label="6 hours">6</span>
                <span id="custom-analog-clock-hours-7" role="option" data-ok-time-clock-number data-ok-position="7" data-ok-value="7" aria-label="7 hours">7</span>
                <span id="custom-analog-clock-hours-8" role="option" data-ok-time-clock-number data-ok-position="8" data-ok-value="8" aria-label="8 hours">8</span>
                <span id="custom-analog-clock-hours-9" role="option" data-ok-time-clock-number data-ok-position="9" data-ok-value="9" aria-label="9 hours" aria-selected="true">9</span>
                <span id="custom-analog-clock-hours-10" role="option" data-ok-time-clock-number data-ok-position="10" data-ok-value="10" aria-label="10 hours">10</span>
                <span id="custom-analog-clock-hours-11" role="option" data-ok-time-clock-number data-ok-position="11" data-ok-value="11" aria-label="11 hours">11</span>
                <span id="custom-analog-clock-hours-12" role="option" data-ok-time-clock-number data-ok-position="0" data-ok-value="12" aria-label="12 hours">12</span>
              </div>
            </div>
            <div data-ok-time-clock-nav>
              <button type="button" data-ok-icon-button data-ok-color="default" data-ok-size="sm" data-ok-time-clock-prev aria-label="Open previous view" title="Open previous view" disabled>
                <svg data-ok-icon="alt-arrow-left-linear" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5L9 12L15 19"></path></svg>
              </button>
              <button type="button" data-ok-icon-button data-ok-color="default" data-ok-size="sm" data-ok-time-clock-next aria-label="Open next view" title="Open next view">
                <svg data-ok-icon="alt-arrow-right-linear" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5L15 12L9 19"></path></svg>
              </button>
            </div>
          </div>
        </div>
        <div data-ok-picker-actions>
          <button type="button" data-ok-button data-ok-variant="text" data-ok-color="inherit" data-ok-size="md" data-ok-picker-action="cancel">
            <span data-ok-button-label>Cancel</span>
          </button>
          <button type="button" data-ok-button data-ok-variant="contained" data-ok-color="inherit" data-ok-size="md" data-ok-picker-action="accept">
            <span data-ok-button-label>OK</span>
          </button>
        </div>
      </div>
    </div>
  </div>
  <div data-ok-date-picker data-ok-picker-variant="desktop" data-ok-orientation="portrait">
    <div data-ok-text-field data-ok-variant="outlined" data-ok-size="medium" data-ok-color="default" data-ok-margin="none" data-ok-shrink data-ok-date-field data-ok-format-density="dense" data-ok-value="2025-05-25" data-ok-format="MM/DD/YYYY">
      <label data-ok-text-field-label id="custom-field-only-label" for="custom-field-only">Field only</label>
      <div data-ok-text-field-control>
        <div id="custom-field-only" role="group" data-ok-text-field-input data-ok-date-field-sections aria-labelledby="custom-field-only-label">
          <span data-ok-date-field-section>
            <span data-ok-date-field-content data-ok-section="month" role="spinbutton" aria-label="Month" aria-valuenow="5" aria-valuemin="1" aria-valuemax="12" aria-valuetext="May" tabindex="0" contenteditable="true" inputmode="numeric" spellcheck="false" autocapitalize="off" autocorrect="off" enterkeyhint="next">05</span>
            <span data-ok-date-field-separator>/</span>
          </span>
          <span data-ok-date-field-section>
            <span data-ok-date-field-content data-ok-section="day" role="spinbutton" aria-label="Day" aria-valuenow="25" aria-valuemin="1" aria-valuemax="31" aria-valuetext="25" tabindex="-1" contenteditable="true" inputmode="numeric" spellcheck="false" autocapitalize="off" autocorrect="off" enterkeyhint="next">25</span>
            <span data-ok-date-field-separator>/</span>
          </span>
          <span data-ok-date-field-section>
            <span data-ok-date-field-content data-ok-section="year" role="spinbutton" aria-label="Year" aria-valuenow="2025" aria-valuemin="0" aria-valuemax="9999" aria-valuetext="2025" tabindex="-1" contenteditable="true" inputmode="numeric" spellcheck="false" autocapitalize="off" autocorrect="off" enterkeyhint="done">2025</span>
          </span>
        </div>
        <input type="hidden" data-ok-date-field-input value="2025-05-25">
        <span data-ok-text-field-adornment="end"></span>
        <fieldset data-ok-text-field-outline aria-hidden="true">
          <legend>
            <span>Field only</span>
          </legend>
        </fieldset>
      </div>
    </div>
  </div>
</div>
