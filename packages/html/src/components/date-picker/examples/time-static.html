<div class="sb-date-pickers-static">
  <div data-ok-date-picker data-ok-picker-variant="static" data-ok-orientation="portrait" data-ok-value-type="time">
    <div data-ok-picker-layout data-ok-orientation="portrait">
      <div data-ok-picker-toolbar>
        <span data-ok-picker-toolbar-overline id="tp-static-toolbar">Select time</span>
        <div data-ok-picker-toolbar-content>
          <div data-ok-picker-toolbar-time>
            <span data-ok-picker-toolbar-part>
              <button type="button" data-ok-picker-toolbar-button data-ok-view="hours" data-ok-selected tabindex="-1">09</button>
            </span>
            <span data-ok-picker-toolbar-part>
              <span data-ok-picker-toolbar-separator aria-hidden="true">:</span>
              <button type="button" data-ok-picker-toolbar-button data-ok-view="minutes" tabindex="-1">30</button>
            </span>
          </div>
          <div data-ok-picker-toolbar-ampm>
            <button type="button" data-ok-picker-toolbar-meridiem="am" aria-pressed="true">AM</button>
            <button type="button" data-ok-picker-toolbar-meridiem="pm" aria-pressed="false">PM</button>
          </div>
        </div>
      </div>
      <div data-ok-picker-content>
        <div id="tp-static-clock" data-ok-time-clock data-ok-ampm="true" data-ok-value="09:30:00" data-ok-view="hours" data-ok-views="hours minutes">
          <div data-ok-time-clock-dial>
            <span data-ok-time-clock-pin></span>
            <span data-ok-time-clock-pointer></span>
            <div role="listbox" data-ok-time-clock-options tabindex="0" aria-label="Select hours. Selected time is 09:30 AM" aria-activedescendant="tp-static-clock-hours-9">
              <span id="tp-static-clock-hours-1" role="option" data-ok-time-clock-number data-ok-position="1" data-ok-value="1" aria-label="1 hours">1</span>
              <span id="tp-static-clock-hours-2" role="option" data-ok-time-clock-number data-ok-position="2" data-ok-value="2" aria-label="2 hours">2</span>
              <span id="tp-static-clock-hours-3" role="option" data-ok-time-clock-number data-ok-position="3" data-ok-value="3" aria-label="3 hours">3</span>
              <span id="tp-static-clock-hours-4" role="option" data-ok-time-clock-number data-ok-position="4" data-ok-value="4" aria-label="4 hours">4</span>
              <span id="tp-static-clock-hours-5" role="option" data-ok-time-clock-number data-ok-position="5" data-ok-value="5" aria-label="5 hours">5</span>
              <span id="tp-static-clock-hours-6" role="option" data-ok-time-clock-number data-ok-position="6" data-ok-value="6" aria-label="6 hours">6</span>
              <span id="tp-static-clock-hours-7" role="option" data-ok-time-clock-number data-ok-position="7" data-ok-value="7" aria-label="7 hours">7</span>
              <span id="tp-static-clock-hours-8" role="option" data-ok-time-clock-number data-ok-position="8" data-ok-value="8" aria-label="8 hours">8</span>
              <span id="tp-static-clock-hours-9" role="option" data-ok-time-clock-number data-ok-position="9" data-ok-value="9" aria-label="9 hours" aria-selected="true">9</span>
              <span id="tp-static-clock-hours-10" role="option" data-ok-time-clock-number data-ok-position="10" data-ok-value="10" aria-label="10 hours">10</span>
              <span id="tp-static-clock-hours-11" role="option" data-ok-time-clock-number data-ok-position="11" data-ok-value="11" aria-label="11 hours">11</span>
              <span id="tp-static-clock-hours-12" role="option" data-ok-time-clock-number data-ok-position="0" data-ok-value="12" aria-label="12 hours">12</span>
            </div>
          </div>
          <div data-ok-time-clock-nav>
            <button type="button" data-ok-icon-button data-ok-color="default" data-ok-size="sm" data-ok-time-clock-prev aria-label="Open previous view" title="Open previous view" disabled>
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"></path></svg>
            </button>
            <button type="button" data-ok-icon-button data-ok-color="default" data-ok-size="sm" data-ok-time-clock-next aria-label="Open next view" title="Open next view">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg>
            </button>
          </div>
        </div>
      </div>
      <div data-ok-picker-actions>
        <button type="button" data-ok-button data-ok-variant="text" data-ok-color="inherit" data-ok-size="md" data-ok-picker-action="cancel">
          <span data-ok-button-label>Cancel</span>
        </button>
        <button type="button" data-ok-button data-ok-variant="contained" data-ok-color="inherit" data-ok-size="md" data-ok-picker-action="accept">
          <span data-ok-button-label>OK</span>
        </button>
      </div>
    </div>
  </div>
  <div data-ok-date-picker data-ok-picker-variant="static" data-ok-orientation="landscape" data-ok-value-type="time" data-ok-open-to="minutes">
    <div data-ok-picker-layout data-ok-orientation="landscape">
      <div data-ok-picker-toolbar>
        <span data-ok-picker-toolbar-overline id="tp-static-landscape-toolbar">Select time</span>
        <div data-ok-picker-toolbar-content>
          <div data-ok-picker-toolbar-time>
            <span data-ok-picker-toolbar-part>
              <button type="button" data-ok-picker-toolbar-button data-ok-view="hours" tabindex="-1">09</button>
            </span>
            <span data-ok-picker-toolbar-part>
              <span data-ok-picker-toolbar-separator aria-hidden="true">:</span>
              <button type="button" data-ok-picker-toolbar-button data-ok-view="minutes" data-ok-selected tabindex="-1">30</button>
            </span>
          </div>
          <div data-ok-picker-toolbar-ampm>
            <button type="button" data-ok-picker-toolbar-meridiem="am" aria-pressed="true">AM</button>
            <button type="button" data-ok-picker-toolbar-meridiem="pm" aria-pressed="false">PM</button>
          </div>
        </div>
      </div>
      <div data-ok-picker-content>
        <div id="tp-static-landscape-clock" data-ok-time-clock data-ok-ampm="true" data-ok-value="09:30:00" data-ok-view="minutes" data-ok-views="hours minutes">
          <div data-ok-time-clock-dial>
            <span data-ok-time-clock-pin></span>
            <span data-ok-time-clock-pointer></span>
            <div role="listbox" data-ok-time-clock-options tabindex="0" aria-label="Select minutes. Selected time is 09:30 AM" aria-activedescendant="tp-static-landscape-clock-minutes-30">
              <span id="tp-static-landscape-clock-minutes-0" role="option" data-ok-time-clock-number data-ok-position="0" data-ok-value="0" aria-label="00 minutes">00</span>
              <span id="tp-static-landscape-clock-minutes-5" role="option" data-ok-time-clock-number data-ok-position="1" data-ok-value="5" aria-label="05 minutes">05</span>
              <span id="tp-static-landscape-clock-minutes-10" role="option" data-ok-time-clock-number data-ok-position="2" data-ok-value="10" aria-label="10 minutes">10</span>
              <span id="tp-static-landscape-clock-minutes-15" role="option" data-ok-time-clock-number data-ok-position="3" data-ok-value="15" aria-label="15 minutes">15</span>
              <span id="tp-static-landscape-clock-minutes-20" role="option" data-ok-time-clock-number data-ok-position="4" data-ok-value="20" aria-label="20 minutes">20</span>
              <span id="tp-static-landscape-clock-minutes-25" role="option" data-ok-time-clock-number data-ok-position="5" data-ok-value="25" aria-label="25 minutes">25</span>
              <span id="tp-static-landscape-clock-minutes-30" role="option" data-ok-time-clock-number data-ok-position="6" data-ok-value="30" aria-label="30 minutes" aria-selected="true">30</span>
              <span id="tp-static-landscape-clock-minutes-35" role="option" data-ok-time-clock-number data-ok-position="7" data-ok-value="35" aria-label="35 minutes">35</span>
              <span id="tp-static-landscape-clock-minutes-40" role="option" data-ok-time-clock-number data-ok-position="8" data-ok-value="40" aria-label="40 minutes">40</span>
              <span id="tp-static-landscape-clock-minutes-45" role="option" data-ok-time-clock-number data-ok-position="9" data-ok-value="45" aria-label="45 minutes">45</span>
              <span id="tp-static-landscape-clock-minutes-50" role="option" data-ok-time-clock-number data-ok-position="10" data-ok-value="50" aria-label="50 minutes">50</span>
              <span id="tp-static-landscape-clock-minutes-55" role="option" data-ok-time-clock-number data-ok-position="11" data-ok-value="55" aria-label="55 minutes">55</span>
            </div>
          </div>
          <div data-ok-time-clock-nav>
            <button type="button" data-ok-icon-button data-ok-color="default" data-ok-size="sm" data-ok-time-clock-prev aria-label="Open previous view" title="Open previous view">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"></path></svg>
            </button>
            <button type="button" data-ok-icon-button data-ok-color="default" data-ok-size="sm" data-ok-time-clock-next aria-label="Open next view" title="Open next view" disabled>
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg>
            </button>
          </div>
        </div>
      </div>
      <div data-ok-picker-actions>
        <button type="button" data-ok-button data-ok-variant="text" data-ok-color="inherit" data-ok-size="md" data-ok-picker-action="cancel">
          <span data-ok-button-label>Cancel</span>
        </button>
        <button type="button" data-ok-button data-ok-variant="contained" data-ok-color="inherit" data-ok-size="md" data-ok-picker-action="accept">
          <span data-ok-button-label>OK</span>
        </button>
      </div>
    </div>
  </div>
</div>
