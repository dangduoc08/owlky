<div data-ok-date-picker data-ok-picker-variant="static" data-ok-orientation="portrait" data-ok-actions="clear today cancel accept">
  <div data-ok-picker-layout data-ok-orientation="portrait">
    <div data-ok-picker-toolbar>
      <span data-ok-picker-toolbar-overline id="ds-shortcuts-toolbar">Select date</span>
      <span data-ok-picker-toolbar-title>Sun, May 25</span>
    </div>
    <ul data-ok-picker-shortcuts aria-label="Shortcuts">
      <li>
        <span data-ok-chip data-ok-variant="filled" data-ok-color="default" data-ok-size="medium" data-ok-picker-shortcut data-ok-value="2025-12-25">
          <button type="button" data-ok-chip-action>
            <span data-ok-chip-label>Christmas 2025</span>
          </button>
        </span>
      </li>
      <li>
        <span data-ok-chip data-ok-variant="filled" data-ok-color="default" data-ok-size="medium" data-ok-picker-shortcut data-ok-value="2026-01-01">
          <button type="button" data-ok-chip-action>
            <span data-ok-chip-label>New Year 2026</span>
          </button>
        </span>
      </li>
      <li>
        <span data-ok-chip data-ok-variant="filled" data-ok-color="default" data-ok-size="medium" data-ok-picker-shortcut data-ok-value="2026-06-30">
          <button type="button" data-ok-chip-action>
            <span data-ok-chip-label>Mid-year 2026</span>
          </button>
        </span>
      </li>
    </ul>
    <div data-ok-picker-content>
      <div id="ds-shortcuts-calendar" data-ok-date-calendar data-ok-months-per-row="3" data-ok-years-per-row="4" data-ok-years-order="asc" data-ok-view="day" data-ok-views="year day" data-ok-month="2025-05" data-ok-value="2025-05-25">
        <div data-ok-date-calendar-header>
          <div data-ok-date-calendar-label id="ds-shortcuts-calendar-label" aria-live="polite">May 2025</div>
          <button type="button" data-ok-icon-button data-ok-color="default" data-ok-size="sm" data-ok-date-calendar-switch aria-label="calendar view is open, switch to year view">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
          </button>
          <div data-ok-date-calendar-nav>
            <button type="button" data-ok-icon-button data-ok-color="default" data-ok-size="md" data-ok-date-calendar-prev aria-label="Previous month" title="Previous month">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"></path></svg>
            </button>
            <button type="button" data-ok-icon-button data-ok-color="default" data-ok-size="md" data-ok-date-calendar-next aria-label="Next month" title="Next month">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg>
            </button>
          </div>
        </div>
        <div role="grid" data-ok-day-calendar aria-labelledby="ds-shortcuts-calendar-label">
          <div role="row" data-ok-day-calendar-header>
            <span role="columnheader" aria-label="Sunday">S</span>
            <span role="columnheader" aria-label="Monday">M</span>
            <span role="columnheader" aria-label="Tuesday">T</span>
            <span role="columnheader" aria-label="Wednesday">W</span>
            <span role="columnheader" aria-label="Thursday">T</span>
            <span role="columnheader" aria-label="Friday">F</span>
            <span role="columnheader" aria-label="Saturday">S</span>
          </div>
          <div role="rowgroup">
            <div role="row" aria-rowindex="1">
              <span role="gridcell" data-ok-day-filler></span>
              <span role="gridcell" data-ok-day-filler></span>
              <span role="gridcell" data-ok-day-filler></span>
              <span role="gridcell" data-ok-day-filler></span>
              <button type="button" role="gridcell" data-ok-picker-day data-ok-date="2025-05-01" aria-colindex="5" aria-selected="false" tabindex="-1">1</button>
              <button type="button" role="gridcell" data-ok-picker-day data-ok-date="2025-05-02" aria-colindex="6" aria-selected="false" tabindex="-1">2</button>
              <button type="button" role="gridcell" data-ok-picker-day data-ok-date="2025-05-03" aria-colindex="7" aria-selected="false" tabindex="-1">3</button>
            </div>
            <div role="row" aria-rowindex="2">
              <button type="button" role="gridcell" data-ok-picker-day data-ok-date="2025-05-04" aria-colindex="1" aria-selected="false" tabindex="-1">4</button>
              <button type="button" role="gridcell" data-ok-picker-day data-ok-date="2025-05-05" aria-colindex="2" aria-selected="false" tabindex="-1">5</button>
              <button type="button" role="gridcell" data-ok-picker-day data-ok-date="2025-05-06" aria-colindex="3" aria-selected="false" tabindex="-1">6</button>
              <button type="button" role="gridcell" data-ok-picker-day data-ok-date="2025-05-07" aria-colindex="4" aria-selected="false" tabindex="-1">7</button>
              <button type="button" role="gridcell" data-ok-picker-day data-ok-date="2025-05-08" aria-colindex="5" aria-selected="false" tabindex="-1">8</button>
              <button type="button" role="gridcell" data-ok-picker-day data-ok-date="2025-05-09" aria-colindex="6" aria-selected="false" tabindex="-1">9</button>
              <button type="button" role="gridcell" data-ok-picker-day data-ok-date="2025-05-10" aria-colindex="7" aria-selected="false" tabindex="-1">10</button>
            </div>
            <div role="row" aria-rowindex="3">
              <button type="button" role="gridcell" data-ok-picker-day data-ok-date="2025-05-11" aria-colindex="1" aria-selected="false" tabindex="-1">11</button>
              <button type="button" role="gridcell" data-ok-picker-day data-ok-date="2025-05-12" aria-colindex="2" aria-selected="false" tabindex="-1">12</button>
              <button type="button" role="gridcell" data-ok-picker-day data-ok-date="2025-05-13" aria-colindex="3" aria-selected="false" tabindex="-1">13</button>
              <button type="button" role="gridcell" data-ok-picker-day data-ok-date="2025-05-14" aria-colindex="4" aria-selected="false" tabindex="-1">14</button>
              <button type="button" role="gridcell" data-ok-picker-day data-ok-date="2025-05-15" aria-colindex="5" aria-selected="false" tabindex="-1">15</button>
              <button type="button" role="gridcell" data-ok-picker-day data-ok-date="2025-05-16" aria-colindex="6" aria-selected="false" tabindex="-1">16</button>
              <button type="button" role="gridcell" data-ok-picker-day data-ok-date="2025-05-17" aria-colindex="7" aria-selected="false" tabindex="-1">17</button>
            </div>
            <div role="row" aria-rowindex="4">
              <button type="button" role="gridcell" data-ok-picker-day data-ok-date="2025-05-18" aria-colindex="1" aria-selected="false" tabindex="-1">18</button>
              <button type="button" role="gridcell" data-ok-picker-day data-ok-date="2025-05-19" aria-colindex="2" aria-selected="false" tabindex="-1">19</button>
              <button type="button" role="gridcell" data-ok-picker-day data-ok-date="2025-05-20" aria-colindex="3" aria-selected="false" tabindex="-1">20</button>
              <button type="button" role="gridcell" data-ok-picker-day data-ok-date="2025-05-21" aria-colindex="4" aria-selected="false" tabindex="-1">21</button>
              <button type="button" role="gridcell" data-ok-picker-day data-ok-date="2025-05-22" aria-colindex="5" aria-selected="false" tabindex="-1">22</button>
              <button type="button" role="gridcell" data-ok-picker-day data-ok-date="2025-05-23" aria-colindex="6" aria-selected="false" tabindex="-1">23</button>
              <button type="button" role="gridcell" data-ok-picker-day data-ok-date="2025-05-24" aria-colindex="7" aria-selected="false" tabindex="-1">24</button>
            </div>
            <div role="row" aria-rowindex="5">
              <button type="button" role="gridcell" data-ok-picker-day data-ok-date="2025-05-25" aria-colindex="1" aria-selected="true" tabindex="0">25</button>
              <button type="button" role="gridcell" data-ok-picker-day data-ok-date="2025-05-26" aria-colindex="2" aria-selected="false" tabindex="-1">26</button>
              <button type="button" role="gridcell" data-ok-picker-day data-ok-date="2025-05-27" aria-colindex="3" aria-selected="false" tabindex="-1">27</button>
              <button type="button" role="gridcell" data-ok-picker-day data-ok-date="2025-05-28" aria-colindex="4" aria-selected="false" tabindex="-1">28</button>
              <button type="button" role="gridcell" data-ok-picker-day data-ok-date="2025-05-29" aria-colindex="5" aria-selected="false" tabindex="-1">29</button>
              <button type="button" role="gridcell" data-ok-picker-day data-ok-date="2025-05-30" aria-colindex="6" aria-selected="false" tabindex="-1">30</button>
              <button type="button" role="gridcell" data-ok-picker-day data-ok-date="2025-05-31" aria-colindex="7" aria-selected="false" tabindex="-1">31</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div data-ok-picker-actions>
      <button type="button" data-ok-button data-ok-variant="text" data-ok-color="inherit" data-ok-size="md" data-ok-picker-action="clear">
        <span data-ok-button-label>Clear</span>
      </button>
      <button type="button" data-ok-button data-ok-variant="text" data-ok-color="inherit" data-ok-size="md" data-ok-picker-action="today">
        <span data-ok-button-label>Today</span>
      </button>
      <button type="button" data-ok-button data-ok-variant="text" data-ok-color="inherit" data-ok-size="md" data-ok-picker-action="cancel">
        <span data-ok-button-label>Cancel</span>
      </button>
      <button type="button" data-ok-button data-ok-variant="contained" data-ok-color="inherit" data-ok-size="md" data-ok-picker-action="accept">
        <span data-ok-button-label>OK</span>
      </button>
    </div>
  </div>
</div>
