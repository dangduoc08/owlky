<div class="sb-walktour">
  <button type="button" data-ok-button data-ok-variant="outlined" data-ok-color="inherit" data-ok-size="md" aria-controls="tour-beacons" data-ok-walktour-start="tour-beacons"><span data-ok-button-label>Restart the tour</span></button>
  <div class="sb-walktour-dashboard">
    <section data-ok-paper data-ok-variant="elevation" data-ok-elevation="1" data-ok-card class="sb-walktour-card" id="tour-b-actions">
      <h3 data-ok-typography data-ok-variant="subtitle2">Quick actions</h3>
      <div class="sb-walktour-actions">
        <button type="button" data-ok-button data-ok-variant="contained" data-ok-color="inherit" data-ok-size="md"><span data-ok-button-label>Request</span></button>
        <button type="button" data-ok-button data-ok-variant="soft" data-ok-color="primary" data-ok-size="md"><span data-ok-button-label>Transfer</span></button>
      </div>
    </section>
    <section data-ok-paper data-ok-variant="elevation" data-ok-elevation="1" data-ok-card class="sb-walktour-card" id="tour-b-notes">
      <h3 data-ok-typography data-ok-variant="subtitle2">Notes</h3>
      <p data-ok-typography data-ok-variant="body2" data-ok-color="textSecondary">Write down what you want to remember.</p>
    </section>
  </div>
  <div id="tour-beacons" data-ok-walktour data-ok-show-skip-button data-ok-run>
    <div data-ok-backdrop data-ok-invisible data-ok-walktour-overlay popover="manual" aria-hidden="true">
      <svg data-ok-walktour-spotlight aria-hidden="true" focusable="false"><path data-ok-walktour-mask fill-rule="evenodd"></path><path data-ok-walktour-hole></path></svg>
    </div>
    <button type="button" data-ok-walktour-beacon aria-label="Open the dialog" aria-haspopup="dialog" hidden><span data-ok-walktour-beacon-inner></span></button>
    <div popover="manual" data-ok-popover data-ok-arrow data-ok-walktour-step data-ok-placement="center" data-ok-disable-beacon data-ok-target="body" role="dialog" aria-labelledby="tour-beacons-step-1-title" aria-describedby="tour-beacons-step-1-content">
      <span data-ok-popover-arrow aria-hidden="true"></span>
      <div data-ok-walktour-header>
        <h2 data-ok-walktour-title id="tour-beacons-step-1-title">Welcome</h2>
        <button type="button" data-ok-icon-button data-ok-color="default" data-ok-size="sm" data-ok-walktour-action="close" aria-label="Close"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path fill="currentColor" d="m12 13.41 5.66 5.66a1 1 0 0 0 1.41-1.41L13.41 12l5.66-5.66a1 1 0 0 0-1.41-1.41L12 10.59 6.34 4.93a1 1 0 0 0-1.41 1.41L10.59 12l-5.66 5.66a1 1 0 1 0 1.41 1.41z"></path></svg></button>
      </div>
      <div data-ok-walktour-content id="tour-beacons-step-1-content">This tour shows a beacon on each target. Select a beacon to open its step.</div>
      <span role="progressbar" data-ok-linear-progress data-ok-variant="determinate" data-ok-color="primary" aria-valuenow="33" aria-valuemin="0" aria-valuemax="100" aria-hidden="true">
        <span data-ok-linear-progress-bar="1"></span>
      </span>
      <div data-ok-walktour-footer>
        <button type="button" data-ok-button data-ok-variant="text" data-ok-color="inherit" data-ok-size="md" data-ok-walktour-action="skip"><span data-ok-button-label>Skip</span></button>
        <button type="button" data-ok-button data-ok-variant="outlined" data-ok-color="inherit" data-ok-size="md" data-ok-walktour-action="back"><span data-ok-button-label>Back</span></button>
        <button type="button" data-ok-button data-ok-variant="contained" data-ok-color="inherit" data-ok-size="md" data-ok-walktour-action="primary"><span data-ok-button-label>Close<span data-ok-walktour-progress> (1/3)</span></span></button>
      </div>
    </div>
    <div popover="manual" data-ok-popover data-ok-arrow data-ok-walktour-step data-ok-placement="auto" data-ok-spotlight-clicks data-ok-target="#tour-b-actions" role="dialog" aria-labelledby="tour-beacons-step-2-title" aria-describedby="tour-beacons-step-2-content">
      <span data-ok-popover-arrow aria-hidden="true"></span>
      <div data-ok-walktour-header>
        <h2 data-ok-walktour-title id="tour-beacons-step-2-title">Try it</h2>
        <button type="button" data-ok-icon-button data-ok-color="default" data-ok-size="sm" data-ok-walktour-action="close" aria-label="Close"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path fill="currentColor" d="m12 13.41 5.66 5.66a1 1 0 0 0 1.41-1.41L13.41 12l5.66-5.66a1 1 0 0 0-1.41-1.41L12 10.59 6.34 4.93a1 1 0 0 0-1.41 1.41L10.59 12l-5.66 5.66a1 1 0 1 0 1.41 1.41z"></path></svg></button>
      </div>
      <div data-ok-walktour-content id="tour-beacons-step-2-content">The spotlight lets you use the buttons while the step is open.</div>
      <span role="progressbar" data-ok-linear-progress data-ok-variant="determinate" data-ok-color="primary" aria-valuenow="67" aria-valuemin="0" aria-valuemax="100" aria-hidden="true">
        <span data-ok-linear-progress-bar="1"></span>
      </span>
      <div data-ok-walktour-footer>
        <button type="button" data-ok-button data-ok-variant="text" data-ok-color="inherit" data-ok-size="md" data-ok-walktour-action="skip"><span data-ok-button-label>Skip</span></button>
        <button type="button" data-ok-button data-ok-variant="outlined" data-ok-color="inherit" data-ok-size="md" data-ok-walktour-action="back"><span data-ok-button-label>Back</span></button>
        <button type="button" data-ok-button data-ok-variant="contained" data-ok-color="inherit" data-ok-size="md" data-ok-walktour-action="primary"><span data-ok-button-label>Close<span data-ok-walktour-progress> (2/3)</span></span></button>
      </div>
    </div>
    <div popover="manual" data-ok-popover data-ok-arrow data-ok-walktour-step data-ok-placement="top" data-ok-disable-overlay data-ok-target="#tour-b-notes" role="dialog" aria-labelledby="tour-beacons-step-3-title" aria-describedby="tour-beacons-step-3-content">
      <span data-ok-popover-arrow aria-hidden="true"></span>
      <div data-ok-walktour-header>
        <h2 data-ok-walktour-title id="tour-beacons-step-3-title">No overlay</h2>
        <button type="button" data-ok-icon-button data-ok-color="default" data-ok-size="sm" data-ok-walktour-action="close" aria-label="Close"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path fill="currentColor" d="m12 13.41 5.66 5.66a1 1 0 0 0 1.41-1.41L13.41 12l5.66-5.66a1 1 0 0 0-1.41-1.41L12 10.59 6.34 4.93a1 1 0 0 0-1.41 1.41L10.59 12l-5.66 5.66a1 1 0 1 0 1.41 1.41z"></path></svg></button>
      </div>
      <div data-ok-walktour-content id="tour-beacons-step-3-content">This step leaves the page usable: there is no overlay.</div>
      <span role="progressbar" data-ok-linear-progress data-ok-variant="determinate" data-ok-color="primary" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100" aria-hidden="true">
        <span data-ok-linear-progress-bar="1"></span>
      </span>
      <div data-ok-walktour-footer>
        <button type="button" data-ok-button data-ok-variant="text" data-ok-color="inherit" data-ok-size="md" data-ok-walktour-action="skip"><span data-ok-button-label>Skip</span></button>
        <button type="button" data-ok-button data-ok-variant="outlined" data-ok-color="inherit" data-ok-size="md" data-ok-walktour-action="back"><span data-ok-button-label>Back</span></button>
        <button type="button" data-ok-button data-ok-variant="contained" data-ok-color="primary" data-ok-size="md" data-ok-walktour-action="primary"><span data-ok-button-label>Last</span></button>
      </div>
    </div>
    <span data-ok-walktour-live aria-live="polite" aria-atomic="true" data-ok-format="Step {current} of {total}"></span>
  </div>
</div>
