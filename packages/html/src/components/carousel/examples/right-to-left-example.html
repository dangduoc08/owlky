<div dir="rtl" class="sb-carousel">
  <section aria-roledescription="carousel" data-ok-carousel data-ok-align="center" data-ok-axis="x" data-ok-contain-scroll="trimSnaps" data-ok-effect="none" data-ok-loop data-ok-slide-spacing="20" data-ok-slides-to-show="70%" aria-label="Right to left">
    <div data-ok-carousel-viewport tabindex="0">
      <div data-ok-carousel-container>
        <div role="group" aria-roledescription="slide" aria-label="1 of 4" data-ok-carousel-slide data-ok-snapped>
          <div class="sb-carousel-image"><span class="sb-carousel-index">5</span><img src="carousel/slide-5.svg" alt="Coral reef"></div>
        </div>
        <div role="group" aria-roledescription="slide" aria-label="2 of 4" data-ok-carousel-slide>
          <div class="sb-carousel-image"><span class="sb-carousel-index">6</span><img src="carousel/slide-6.svg" alt="Northern lights"></div>
        </div>
        <div role="group" aria-roledescription="slide" aria-label="3 of 4" data-ok-carousel-slide>
          <div class="sb-carousel-image"><span class="sb-carousel-index">7</span><img src="carousel/slide-7.svg" alt="Desert dunes"></div>
        </div>
        <div role="group" aria-roledescription="slide" aria-label="4 of 4" data-ok-carousel-slide>
          <div class="sb-carousel-image"><span class="sb-carousel-index">8</span><img src="carousel/slide-8.svg" alt="Glacier blue"></div>
        </div>
      </div>
      <span data-ok-carousel-live aria-live="polite" aria-atomic="true"></span>
    </div>
    <div class="sb-carousel-controls">
      <div data-ok-carousel-arrows data-ok-variant="basic" data-ok-color="inherit">
        <button type="button" data-ok-icon-button data-ok-color="default" data-ok-size="md" data-ok-carousel-prev aria-label="Previous slide"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></button>
        <button type="button" data-ok-icon-button data-ok-color="default" data-ok-size="md" data-ok-carousel-next aria-label="Next slide"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg></button>
      </div>
      <div data-ok-carousel-dots data-ok-variant="circular" data-ok-color="inherit">
        <button type="button" data-ok-carousel-dot aria-label="Go to slide 1" aria-current="true"></button>
        <button type="button" data-ok-carousel-dot aria-label="Go to slide 2"></button>
        <button type="button" data-ok-carousel-dot aria-label="Go to slide 3"></button>
        <button type="button" data-ok-carousel-dot aria-label="Go to slide 4"></button>
      </div>
    </div>
