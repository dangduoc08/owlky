<button type="button" data-ok-button data-ok-variant="contained" data-ok-color="success" data-ok-size="md" data-ok-toast-open="toast-rich-success">
  <span data-ok-button-label>Success</span>
</button>
<button type="button" data-ok-button data-ok-variant="contained" data-ok-color="error" data-ok-size="md" data-ok-toast-open="toast-rich-error">
  <span data-ok-button-label>Error</span>
</button>
<section data-ok-toaster data-ok-position="top-right" data-ok-close-button data-ok-rich-colors aria-label="Notifications">
  <ol data-ok-toaster-list aria-live="polite"></ol>
</section>
<template id="toast-rich-success">
  <li data-ok-toast data-ok-type="success">
    <span data-ok-toast-icon aria-hidden="true"><svg data-ok-icon="check-circle-linear" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-linecap="round"><circle cx="12" cy="12" r="10" /><path stroke-linejoin="round" d="M8.5 12.5L10.5 14.5L15.5 9.5" /></svg></span>
    <div data-ok-toast-content>
      <div data-ok-toast-title>Event has been created</div>
    </div>
    <button type="button" data-ok-toast-close aria-label="Close"><svg data-ok-icon="close-linear" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M19.01 5L5.01 19" /><path d="M19 19L5 5" /></svg></button>
  </li>
</template>
<template id="toast-rich-error">
  <li data-ok-toast data-ok-type="error">
    <span data-ok-toast-icon aria-hidden="true"><svg data-ok-icon="danger-circle-linear" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-linecap="round"><circle cx="12" cy="12" r="10" /><path d="M12 7V13" /><path stroke-linejoin="round" d="M12 16H12" /></svg></span>
    <div data-ok-toast-content>
      <div data-ok-toast-title>Event has not been created</div>
    </div>
    <button type="button" data-ok-toast-close aria-label="Close"><svg data-ok-icon="close-linear" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M19.01 5L5.01 19" /><path d="M19 19L5 5" /></svg></button>
  </li>
</template>
