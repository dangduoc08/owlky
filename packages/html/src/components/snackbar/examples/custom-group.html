<button type="button" data-ok-button data-ok-variant="outlined" data-ok-color="inherit" data-ok-size="md" data-ok-toast-open="toast-action">
  <span data-ok-button-label>Action</span>
</button>
<button type="button" data-ok-button data-ok-variant="outlined" data-ok-color="inherit" data-ok-size="md" data-ok-toast-open="toast-custom-action">
  <span data-ok-button-label>Custom action</span>
</button>
<button type="button" data-ok-button data-ok-variant="outlined" data-ok-color="inherit" data-ok-size="md" data-ok-toast-open="toast-custom">
  <span data-ok-button-label>Custom</span>
</button>
<section data-ok-toaster data-ok-position="top-right" data-ok-close-button aria-label="Notifications">
  <ol data-ok-toaster-list aria-live="polite"></ol>
</section>
<template id="toast-action">
  <li data-ok-toast data-ok-type="default">
    <div data-ok-toast-content>
      <div data-ok-toast-title>Event has been created</div>
    </div>
    <button type="button" data-ok-toast-action>Undo</button>
  </li>
</template>
<template id="toast-custom-action">
  <li data-ok-toast data-ok-type="warning">
    <span data-ok-toast-icon aria-hidden="true"><svg data-ok-icon="danger-triangle-linear" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M5.31 10.76C8.23 5.59 9.69 3 12 3C14.31 3 15.77 5.59 18.69 10.76L19.05 11.41C21.48 15.71 22.69 17.86 21.59 19.43C20.5 21 17.79 21 12.36 21H11.64C6.21 21 3.5 21 2.41 19.43C1.31 17.86 2.52 15.71 4.95 11.41L5.31 10.76Z" /><path d="M12 8V13" /><path stroke-linejoin="round" d="M12 16H12" /></svg></span>
    <div data-ok-toast-content>
      <div data-ok-toast-title>Title</div>
      <div data-ok-toast-description>Description</div>
    </div>
    <div data-ok-toast-actions>
      <button type="button" data-ok-button data-ok-variant="text" data-ok-color="warning" data-ok-size="sm" data-ok-toast-dismiss>
        <span data-ok-button-label>Action</span>
      </button>
      <button type="button" data-ok-button data-ok-variant="text" data-ok-color="inherit" data-ok-size="sm" data-ok-toast-dismiss>
        <span data-ok-button-label>Dismiss</span>
      </button>
    </div>
  </li>
</template>
<template id="toast-custom">
  <li data-ok-toast data-ok-type="success">
    <span data-ok-toast-icon aria-hidden="true"><svg data-ok-icon="check-circle-linear" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-linecap="round"><circle cx="12" cy="12" r="10" /><path stroke-linejoin="round" d="M8.5 12.5L10.5 14.5L15.5 9.5" /></svg></span>
    <div data-ok-toast-content>
      <div data-ok-toast-title><strong>Event has been created</strong></div>
      <div data-ok-toast-description><em>Monday at 6:00 PM</em></div>
    </div>
    <button type="button" data-ok-toast-close aria-label="Close"><svg data-ok-icon="close-linear" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M19.01 5L5.01 19" /><path d="M19 19L5 5" /></svg></button>
  </li>
</template>
