<div class="sb-phone-demo">
  <div data-ok-text-field data-ok-variant="outlined" data-ok-size="medium" data-ok-color="default" data-ok-full-width data-ok-margin="none" data-ok-phone-input data-ok-validate data-ok-default-country="US" data-ok-invalid-text="Enter a valid phone number">
    <label data-ok-text-field-label for="phone-validation">Phone number</label>
    <div data-ok-text-field-control>
      <div data-ok-text-field-adornment="start" data-ok-phone-input-country>
        <div data-ok-select data-ok-display-empty>
          <div data-ok-select-display role="combobox" tabindex="0" id="phone-validation-country" aria-haspopup="listbox" aria-expanded="false" aria-controls="phone-validation-country-listbox" aria-label="Country">
            <span data-ok-list-item-icon data-ok-phone-input-flag aria-hidden="true">🇺🇸</span>
            <span data-ok-list-item-text>
              <span data-ok-list-item-text-primary>United States</span>
              <span data-ok-list-item-text-secondary>US (+1)</span>
            </span>
          </div>
          <input data-ok-select-input aria-hidden="true" tabindex="-1" placeholder=" " value="US">
          <svg aria-hidden="true" viewBox="0 0 24 24" data-ok-select-icon><path d="m7 10 5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          <div popover="manual" data-ok-popover data-ok-placement="bottom-start" id="phone-validation-country-menu" tabindex="-1">
            <span data-ok-popover-arrow aria-hidden="true"></span>
            <ul data-ok-select-listbox role="listbox" id="phone-validation-country-listbox">
            </ul>
          </div>
        </div>
      </div>
      <input autocomplete="tel" id="phone-validation" data-ok-text-field-input aria-describedby="phone-validation-helper-text" type="tel" placeholder="Enter phone number" value="">
      <fieldset data-ok-text-field-outline aria-hidden="true">
        <legend>
          <span>Phone number</span>
        </legend>
      </fieldset>
    </div>
    <div data-ok-text-field-helper id="phone-validation-helper-text">We only call about your order</div>
  </div>
  <dl class="sb-phone-values">
    <div class="sb-phone-row">
      <dt data-ok-typography data-ok-variant="body2" data-ok-color="textSecondary">National:</dt>
      <dd data-ok-typography data-ok-variant="subtitle2" class="sb-phone-national">-</dd>
    </div>
    <div class="sb-phone-row">
      <dt data-ok-typography data-ok-variant="body2" data-ok-color="textSecondary">International:</dt>
      <dd data-ok-typography data-ok-variant="subtitle2" class="sb-phone-international">-</dd>
    </div>
    <div class="sb-phone-row">
      <dt data-ok-typography data-ok-variant="body2" data-ok-color="textSecondary">Raw:</dt>
      <dd data-ok-typography data-ok-variant="subtitle2" class="sb-phone-raw">-</dd>
    </div>
  </dl>
</div>
