<div class="sb-phone-demo">
  <div data-ok-text-field data-ok-variant="outlined" data-ok-size="medium" data-ok-color="default" data-ok-full-width data-ok-margin="none" data-ok-phone-input data-ok-international data-ok-hide-select data-ok-country="AU">
    <label data-ok-text-field-label for="phone-hide-select">Phone number</label>
    <div data-ok-text-field-control>
      <input autocomplete="tel" id="phone-hide-select" data-ok-text-field-input type="tel" placeholder="Enter phone number" value="+61 2 9876 5432">
      <fieldset data-ok-text-field-outline aria-hidden="true">
        <legend>
          <span>Phone number</span>
        </legend>
      </fieldset>
    </div>
  </div>
  <dl class="sb-phone-values">
    <div class="sb-phone-row">
      <dt data-ok-typography data-ok-variant="body2" data-ok-color="textSecondary">National:</dt>
      <dd data-ok-typography data-ok-variant="subtitle2" class="sb-phone-national">(02) 9876 5432</dd>
    </div>
    <div class="sb-phone-row">
      <dt data-ok-typography data-ok-variant="body2" data-ok-color="textSecondary">International:</dt>
      <dd data-ok-typography data-ok-variant="subtitle2" class="sb-phone-international">+61 2 9876 5432</dd>
    </div>
    <div class="sb-phone-row">
      <dt data-ok-typography data-ok-variant="body2" data-ok-color="textSecondary">Raw:</dt>
      <dd data-ok-typography data-ok-variant="subtitle2" class="sb-phone-raw">+61298765432</dd>
    </div>
  </dl>
</div>
