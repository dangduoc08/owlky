<button type="button" data-ok-button data-ok-variant="contained" data-ok-color="inherit" data-ok-size="md" aria-haspopup="dialog" aria-expanded="false" aria-controls="popover-click" data-ok-popover-open="popover-click">
  <span data-ok-button-label>Click popover</span>
</button>
<div popover="manual" data-ok-popover data-ok-placement="bottom" id="popover-click" role="dialog" aria-labelledby="popover-click-title">
  <span data-ok-popover-arrow aria-hidden="true"></span>
  <div>
    <h6 data-ok-typography data-ok-variant="subtitle1" id="popover-click-title">Quarterly summary</h6>
    <p data-ok-typography data-ok-variant="body2" data-ok-color="textSecondary">Revenue grew in every region this quarter. Open the report for the details.</p>
  </div>
</div>
<button type="button" data-ok-button data-ok-variant="outlined" data-ok-color="inherit" data-ok-size="md" aria-expanded="false" aria-controls="popover-hover" data-ok-popover-hover="popover-hover">
  <span data-ok-button-label>Hover popover</span>
</button>
<div popover="manual" data-ok-popover data-ok-placement="bottom" data-ok-disable-auto-focus data-ok-disable-restore-focus id="popover-hover">
  <span data-ok-popover-arrow aria-hidden="true"></span>
  <div>
    <h6 data-ok-typography data-ok-variant="subtitle1">Shown on hover</h6>
    <p data-ok-typography data-ok-variant="body2" data-ok-color="textSecondary">This popover follows the pointer and keyboard focus on its trigger.</p>
  </div>
</div>
