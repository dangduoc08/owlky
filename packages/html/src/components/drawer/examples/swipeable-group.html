<div class="sb-row">
  <button type="button" data-ok-button data-ok-variant="outlined" data-ok-color="inherit" data-ok-size="md" aria-haspopup="dialog" data-ok-drawer-open="swipeable-left"><span data-ok-button-label>Left</span></button>
  <dialog data-ok-drawer data-ok-anchor="left" data-ok-variant="temporary" data-ok-swipeable id="swipeable-left" aria-label="Left swipeable drawer">
    <div data-ok-drawer-content>
      <h2 data-ok-typography data-ok-variant="subtitle1" class="sb-drawer-swipe-title">Mailbox</h2>
      <section data-ok-scrollbar aria-label="scrollable content" tabindex="0">
        <nav aria-label="Left menu">
          <ul data-ok-list>
            <li data-ok-list-item data-ok-disable-padding>
              <button type="button" data-ok-list-item-button><span data-ok-list-item-text><span data-ok-list-item-text-primary>Inbox</span></span></button>
            </li>
            <li data-ok-list-item data-ok-disable-padding>
              <button type="button" data-ok-list-item-button><span data-ok-list-item-text><span data-ok-list-item-text-primary>Starred</span></span></button>
            </li>
            <li data-ok-list-item data-ok-disable-padding>
              <button type="button" data-ok-list-item-button><span data-ok-list-item-text><span data-ok-list-item-text-primary>Drafts</span></span></button>
            </li>
            <li data-ok-list-item data-ok-disable-padding>
              <button type="button" data-ok-list-item-button><span data-ok-list-item-text><span data-ok-list-item-text-primary>Trash</span></span></button>
            </li>
          </ul>
        </nav>
      </section>
    </div>
  </dialog>
  <div data-ok-drawer-swipe-area aria-hidden="true">
  </div>
  <button type="button" data-ok-button data-ok-variant="outlined" data-ok-color="inherit" data-ok-size="md" aria-haspopup="dialog" data-ok-drawer-open="swipeable-bottom"><span data-ok-button-label>Bottom</span></button>
  <dialog data-ok-drawer data-ok-anchor="bottom" data-ok-variant="temporary" data-ok-swipeable id="swipeable-bottom" aria-label="Bottom swipeable drawer">
    <div data-ok-drawer-content>
      <h2 data-ok-typography data-ok-variant="subtitle1" class="sb-drawer-swipe-title">Mailbox</h2>
      <section data-ok-scrollbar aria-label="scrollable content" tabindex="0">
        <nav aria-label="Bottom menu">
          <ul data-ok-list>
            <li data-ok-list-item data-ok-disable-padding>
              <button type="button" data-ok-list-item-button><span data-ok-list-item-text><span data-ok-list-item-text-primary>Inbox</span></span></button>
            </li>
            <li data-ok-list-item data-ok-disable-padding>
              <button type="button" data-ok-list-item-button><span data-ok-list-item-text><span data-ok-list-item-text-primary>Starred</span></span></button>
            </li>
            <li data-ok-list-item data-ok-disable-padding>
              <button type="button" data-ok-list-item-button><span data-ok-list-item-text><span data-ok-list-item-text-primary>Drafts</span></span></button>
            </li>
            <li data-ok-list-item data-ok-disable-padding>
              <button type="button" data-ok-list-item-button><span data-ok-list-item-text><span data-ok-list-item-text-primary>Trash</span></span></button>
            </li>
          </ul>
        </nav>
      </section>
    </div>
  </dialog>
  <div data-ok-drawer-swipe-area aria-hidden="true">
  </div>
  <p data-ok-typography data-ok-variant="body2" data-ok-color="textSecondary">On a touch screen, swipe from the left or bottom edge to open a drawer, and towards its edge to close it.</p>
</div>
