<div>
  <button type="button" data-ok-button data-ok-variant="text" data-ok-color="inherit" data-ok-size="md" aria-describedby="tooltip-grow">
    <span data-ok-button-label>Grow</span>
  </button>
  <div id="tooltip-grow" role="tooltip" popover="manual" data-ok-tooltip data-ok-placement="bottom"><span data-ok-tooltip-arrow aria-hidden="true"></span>Grows in</div>
  <button type="button" data-ok-button data-ok-variant="text" data-ok-color="inherit" data-ok-size="md" aria-describedby="tooltip-fade">
    <span data-ok-button-label>Fade</span>
  </button>
  <div id="tooltip-fade" role="tooltip" popover="manual" data-ok-tooltip data-ok-placement="bottom" data-ok-transition="fade"><span data-ok-tooltip-arrow aria-hidden="true"></span>Fades in</div>
  <button type="button" data-ok-button data-ok-variant="text" data-ok-color="inherit" data-ok-size="md" aria-describedby="tooltip-zoom">
    <span data-ok-button-label>Zoom</span>
  </button>
  <div id="tooltip-zoom" role="tooltip" popover="manual" data-ok-tooltip data-ok-placement="bottom" data-ok-transition="zoom"><span data-ok-tooltip-arrow aria-hidden="true"></span>Zooms in</div>
</div>
