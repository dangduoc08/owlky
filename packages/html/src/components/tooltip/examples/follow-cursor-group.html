<div>
  <button type="button" data-ok-button data-ok-variant="outlined" data-ok-color="inherit" data-ok-size="lg" aria-describedby="tooltip-follow">
    <span data-ok-button-label>Move the pointer over this button</span>
  </button>
  <div id="tooltip-follow" role="tooltip" popover="manual" data-ok-tooltip data-ok-placement="bottom" data-ok-follow-cursor><span data-ok-tooltip-arrow aria-hidden="true"></span>The tooltip follows the pointer</div>
  <button type="button" data-ok-button data-ok-variant="outlined" data-ok-color="inherit" data-ok-size="lg" aria-describedby="tooltip-next">
    <span data-ok-button-label>Slow to open</span>
  </button>
  <div id="tooltip-next" role="tooltip" popover="manual" data-ok-tooltip data-ok-placement="bottom" data-ok-enter-delay="500" data-ok-enter-next-delay="100"><span data-ok-tooltip-arrow aria-hidden="true"></span>Opens sooner after another tooltip</div>
</div>
