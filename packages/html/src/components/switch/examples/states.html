<label data-mt-switch data-mt-color="primary" data-mt-size="md">
  <input type="checkbox" role="switch" data-mt-switch-input disabled />
  <span data-mt-switch-track aria-hidden="true"><span data-mt-switch-thumb></span></span>
  <span data-mt-switch-label>Disabled off</span>
</label>
<label data-mt-switch data-mt-color="primary" data-mt-size="md">
  <input type="checkbox" role="switch" data-mt-switch-input disabled checked />
  <span data-mt-switch-track aria-hidden="true"><span data-mt-switch-thumb></span></span>
  <span data-mt-switch-label>Disabled on</span>
</label>
<label data-mt-switch data-mt-color="primary" data-mt-size="md">
  <input type="checkbox" role="switch" data-mt-switch-input aria-label="Airplane mode" />
  <span data-mt-switch-track aria-hidden="true"><span data-mt-switch-thumb></span></span>
</label>
