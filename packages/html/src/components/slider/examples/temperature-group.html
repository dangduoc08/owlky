<span data-ok-slider data-ok-color="primary" data-ok-size="medium" data-ok-orientation="horizontal" data-ok-track="normal" data-ok-value-label-display="auto" data-ok-step="10" data-ok-label-value="{value}°C">
  <span data-ok-slider-rail></span>
  <span data-ok-slider-track></span>
  <span data-ok-slider-mark data-ok-value="0" data-ok-active></span>
  <span data-ok-slider-mark data-ok-value="10" data-ok-active></span>
  <span data-ok-slider-mark data-ok-value="20" data-ok-active></span>
  <span data-ok-slider-mark data-ok-value="30" data-ok-active></span>
  <span data-ok-slider-mark data-ok-value="40"></span>
  <span data-ok-slider-mark data-ok-value="50"></span>
  <span data-ok-slider-mark data-ok-value="60"></span>
  <span data-ok-slider-mark data-ok-value="70"></span>
  <span data-ok-slider-mark data-ok-value="80"></span>
  <span data-ok-slider-mark data-ok-value="90"></span>
  <span data-ok-slider-mark data-ok-value="100"></span>
  <span data-ok-slider-thumb data-ok-index="0">
    <input type="range" min="0" max="100" step="10" aria-label="Temperature" aria-valuetext="30°C" value="30">
    <span data-ok-slider-value-label aria-hidden="true">30°C</span>
  </span>
</span>
