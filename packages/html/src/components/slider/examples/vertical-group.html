<div class="sb-slider-vertical">
  <span data-ok-slider data-ok-color="inherit" data-ok-size="small" data-ok-orientation="vertical" data-ok-track="normal" data-ok-value-label-display="off" data-ok-label-value="{value}°C">
    <span data-ok-slider-rail></span>
    <span data-ok-slider-track></span>
    <span data-ok-slider-mark data-ok-value="0" data-ok-active></span>
    <span data-ok-slider-mark-label data-ok-value="0" aria-hidden="true">0°C</span>
    <span data-ok-slider-mark data-ok-value="20" data-ok-active></span>
    <span data-ok-slider-mark-label data-ok-value="20" aria-hidden="true">20°C</span>
    <span data-ok-slider-mark data-ok-value="37"></span>
    <span data-ok-slider-mark-label data-ok-value="37" aria-hidden="true">37°C</span>
    <span data-ok-slider-mark data-ok-value="100"></span>
    <span data-ok-slider-mark-label data-ok-value="100" aria-hidden="true">100°C</span>
    <span data-ok-slider-thumb data-ok-index="0">
      <input type="range" min="0" max="100" step="1" aria-label="Temperature" aria-valuetext="30°C" aria-orientation="vertical" value="30">
    </span>
  </span>
  <span data-ok-slider data-ok-color="primary" data-ok-size="medium" data-ok-orientation="vertical" data-ok-track="normal" data-ok-value-label-display="off" data-ok-label-value="{value}°C">
    <span data-ok-slider-rail></span>
    <span data-ok-slider-track></span>
    <span data-ok-slider-mark data-ok-value="0"></span>
    <span data-ok-slider-mark-label data-ok-value="0" aria-hidden="true">0°C</span>
    <span data-ok-slider-mark data-ok-value="20" data-ok-active></span>
    <span data-ok-slider-mark-label data-ok-value="20" aria-hidden="true">20°C</span>
    <span data-ok-slider-mark data-ok-value="37" data-ok-active></span>
    <span data-ok-slider-mark-label data-ok-value="37" aria-hidden="true">37°C</span>
    <span data-ok-slider-mark data-ok-value="100"></span>
    <span data-ok-slider-mark-label data-ok-value="100" aria-hidden="true">100°C</span>
    <span data-ok-slider-thumb data-ok-index="0">
      <input type="range" min="0" max="100" step="1" aria-label="Temperature range" aria-valuetext="20°C" aria-orientation="vertical" value="20">
    </span>
    <span data-ok-slider-thumb data-ok-index="1">
      <input type="range" min="0" max="100" step="1" aria-label="Temperature range" aria-valuetext="37°C" aria-orientation="vertical" value="37">
    </span>
  </span>
</div>
