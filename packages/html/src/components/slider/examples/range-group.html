<div class="sb-slider-range">
  <span data-ok-slider data-ok-color="primary" data-ok-size="medium" data-ok-orientation="horizontal" data-ok-track="normal" data-ok-value-label-display="on" data-ok-min="0" data-ok-max="1000" data-ok-step="10" data-ok-label-value="${value}">
    <span data-ok-slider-rail></span>
    <span data-ok-slider-track></span>
    <span data-ok-slider-mark data-ok-value="0"></span>
    <span data-ok-slider-mark-label data-ok-value="0" aria-hidden="true">$0</span>
    <span data-ok-slider-mark data-ok-value="250" data-ok-active></span>
    <span data-ok-slider-mark-label data-ok-value="250" aria-hidden="true">$250</span>
    <span data-ok-slider-mark data-ok-value="500"></span>
    <span data-ok-slider-mark-label data-ok-value="500" aria-hidden="true">$500</span>
    <span data-ok-slider-mark data-ok-value="750"></span>
    <span data-ok-slider-mark-label data-ok-value="750" aria-hidden="true">$750</span>
    <span data-ok-slider-mark data-ok-value="1000"></span>
    <span data-ok-slider-mark-label data-ok-value="1000" aria-hidden="true">$1000</span>
    <span data-ok-slider-thumb data-ok-index="0">
      <input type="range" min="0" max="1000" step="10" aria-label="Minimum price" aria-valuetext="$200" value="200">
      <span data-ok-slider-value-label aria-hidden="true">$200</span>
    </span>
    <span data-ok-slider-thumb data-ok-index="1">
      <input type="range" min="0" max="1000" step="10" aria-label="Maximum price" aria-valuetext="$370" value="370">
      <span data-ok-slider-value-label aria-hidden="true">$370</span>
    </span>
  </span>
  <p>Min: $200 · Max: $370</p>
</div>
