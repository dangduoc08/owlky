<figure data-ok-chart data-ok-type="funnel" data-ok-x-type="category" data-ok-curve="smooth" data-ok-legend="top" data-ok-fill="gradient" data-ok-data-labels>
  <table data-ok-chart-data>
    <caption>Servings per food group</caption>
    <thead>
      <tr><th scope="col">Category</th><th scope="col" data-ok-color="primary-dark">Servings</th></tr>
    </thead>
    <tbody>
      <tr><th scope="row">Sweets</th><td data-ok-color="error">100</td></tr>
      <tr><th scope="row">Oils</th><td data-ok-color="warning">200</td></tr>
      <tr><th scope="row">Meat</th><td data-ok-color="secondary">300</td></tr>
      <tr><th scope="row">Dairy</th><td data-ok-color="info">400</td></tr>
      <tr><th scope="row">Fruits</th><td data-ok-color="success">500</td></tr>
      <tr><th scope="row">Vegetables</th><td data-ok-color="primary">600</td></tr>
      <tr><th scope="row">Grains</th><td data-ok-color="primary-dark">700</td></tr>
    </tbody>
  </table>
</figure>
