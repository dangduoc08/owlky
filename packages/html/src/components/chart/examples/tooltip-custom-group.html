<figure data-ok-chart data-ok-type="bar" data-ok-x-type="category" data-ok-curve="smooth" data-ok-legend="top" data-ok-fill="gradient">
  <table data-ok-chart-data>
    <caption>Orders per weekday (custom tooltip)</caption>
    <thead>
      <tr><th scope="col">Category</th><th scope="col" data-ok-color="primary-dark">Online</th><th scope="col" data-ok-color="warning">In store</th></tr>
    </thead>
    <tbody>
      <tr><th scope="row">Mon</th><td>23</td><td>10</td></tr>
      <tr><th scope="row">Tue</th><td>38</td><td>9</td></tr>
      <tr><th scope="row">Wed</th><td>52</td><td>13</td></tr>
      <tr><th scope="row">Thu</th><td>48</td><td>9</td></tr>
      <tr><th scope="row">Fri</th><td>45</td><td>15</td></tr>
    </tbody>
  </table>
  <template data-ok-chart-tooltip>
    <div data-ok-chart-tooltip-title><span>Orders on </span><span data-ok-chart-tooltip-slot="title"></span></div>
    <div data-ok-chart-tooltip-state data-ok-chart-tooltip-slot="state">Selected</div>
    <div data-ok-chart-tooltip-rows>
      <div data-ok-chart-tooltip-row data-ok-chart-tooltip-slot="row">
        <span data-ok-chart-tooltip-marker data-ok-chart-tooltip-slot="marker"></span>
        <span data-ok-chart-tooltip-slot="name"></span>
        <span data-ok-chart-tooltip-value data-ok-chart-tooltip-slot="value"></span>
      </div>
    </div>
  </template>
</figure>
