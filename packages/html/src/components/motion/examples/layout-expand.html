<div class="sb-layout-stack">
  <div data-ok-motion data-ok-variant="fadeIn" data-ok-trigger="inView" data-ok-initial="false" data-ok-layout class="sb-layout-card">

      <div data-ok-motion data-ok-variant="fadeIn" data-ok-trigger="inView" data-ok-initial="false" data-ok-layout="position" class="sb-layout-card-head">
        <h6 data-ok-typography data-ok-variant="subtitle2">Which plan fits me?</h6>
        <button type="button" data-ok-button data-ok-variant="text" data-ok-color="inherit" data-ok-size="sm" aria-expanded="false" aria-controls="layout-faq-plan"><span data-ok-button-label>Details</span></button>
      </div>
      <p data-ok-typography data-ok-variant="body2" data-ok-color="textSecondary" id="layout-faq-plan" hidden>Start with the free plan. Upgrade when your team needs more seats or storage.</p>
    </div>
  </div>
  <div data-ok-motion data-ok-variant="fadeIn" data-ok-trigger="inView" data-ok-initial="false" data-ok-layout class="sb-layout-card">

      <div data-ok-motion data-ok-variant="fadeIn" data-ok-trigger="inView" data-ok-initial="false" data-ok-layout="position" class="sb-layout-card-head">
        <h6 data-ok-typography data-ok-variant="subtitle2">Can I cancel at any time?</h6>
        <button type="button" data-ok-button data-ok-variant="text" data-ok-color="inherit" data-ok-size="sm" aria-expanded="false" aria-controls="layout-faq-cancel"><span data-ok-button-label>Details</span></button>
      </div>
      <p data-ok-typography data-ok-variant="body2" data-ok-color="textSecondary" id="layout-faq-cancel" hidden>Yes. Your plan stays active until the end of the billing period.</p>
    </div>
  </div>
  <div data-ok-motion data-ok-variant="fadeIn" data-ok-trigger="inView" data-ok-initial="false" data-ok-layout class="sb-layout-card">
    <div data-ok-paper data-ok-variant="elevation" data-ok-elevation="1" data-ok-card class="sb-layout-card-body">
      <div data-ok-motion data-ok-variant="fadeIn" data-ok-trigger="inView" data-ok-initial="false" data-ok-layout="position" class="sb-layout-card-head">
        <h6 data-ok-typography data-ok-variant="subtitle2">Where is my data stored?</h6>
        <button type="button" data-ok-button data-ok-variant="text" data-ok-color="inherit" data-ok-size="sm" aria-expanded="false" aria-controls="layout-faq-data"><span data-ok-button-label>Details</span></button>
      </div>
      <p data-ok-typography data-ok-variant="body2" data-ok-color="textSecondary" id="layout-faq-data" hidden>In the region you pick when you create your workspace.</p>
    </div>
  </div>
</div>
