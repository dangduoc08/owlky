<div class="sb-countdown">
  <span role="timer" data-ok-countdown data-ok-seconds="10" data-ok-largest-unit="seconds" data-ok-paused id="code-countdown" aria-label="Time left to enter the code">
    <span data-ok-countdown-unit="seconds">
      <span data-ok-countdown-value>10</span>
      <span data-ok-countdown-label>seconds</span>
    </span>
    <span data-ok-countdown-status role="status"></span>
  </span>
  <button type="button" data-ok-button data-ok-variant="contained" data-ok-color="inherit" data-ok-size="md" aria-controls="code-countdown" data-ok-countdown-restart="code-countdown"><span data-ok-button-label>Start</span></button>
</div>
