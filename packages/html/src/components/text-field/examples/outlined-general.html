<div data-ok-text-field data-ok-variant="outlined" data-ok-size="medium" data-ok-color="default" data-ok-margin="none" data-ok-full-width>
  <label data-ok-text-field-label for="outlined-inactive">Inactive</label>
  <div data-ok-text-field-control>
    <input id="outlined-inactive" data-ok-text-field-input placeholder=" ">
    <fieldset data-ok-text-field-outline aria-hidden="true"><legend><span>Inactive</span></legend></fieldset>
  </div>
</div>
<div data-ok-text-field data-ok-variant="outlined" data-ok-size="medium" data-ok-color="default" data-ok-margin="none" data-ok-full-width>
  <label data-ok-text-field-label for="outlined-activated">Activated<span data-ok-text-field-asterisk aria-hidden="true"> *</span></label>
  <div data-ok-text-field-control>
    <input id="outlined-activated" data-ok-text-field-input required placeholder=" " value="2Minimal">
    <fieldset data-ok-text-field-outline aria-hidden="true"><legend><span>Activated *</span></legend></fieldset>
  </div>
</div>
<div data-ok-text-field data-ok-variant="outlined" data-ok-size="medium" data-ok-color="default" data-ok-margin="none" data-ok-full-width>
  <label data-ok-text-field-label for="outlined-password">Password</label>
  <div data-ok-text-field-control>
    <input id="outlined-password" data-ok-text-field-input autocomplete="current-password" type="password" placeholder=" " value="2Minimal">
    <fieldset data-ok-text-field-outline aria-hidden="true"><legend><span>Password</span></legend></fieldset>
  </div>
</div>
<div data-ok-text-field data-ok-variant="outlined" data-ok-size="medium" data-ok-color="default" data-ok-margin="none" data-ok-full-width>
  <label data-ok-text-field-label for="outlined-disabled">Disabled</label>
  <div data-ok-text-field-control>
    <input id="outlined-disabled" data-ok-text-field-input disabled placeholder=" " value="2Minimal">
    <fieldset data-ok-text-field-outline aria-hidden="true"><legend><span>Disabled</span></legend></fieldset>
  </div>
</div>
<div data-ok-text-field data-ok-variant="outlined" data-ok-size="medium" data-ok-color="default" data-ok-margin="none" data-ok-full-width>
  <div data-ok-text-field-control>
    <input id="outlined-no-label" data-ok-text-field-input aria-label="Outlined input" placeholder="Outlined input">
    <fieldset data-ok-text-field-outline aria-hidden="true"></fieldset>
  </div>
</div>
