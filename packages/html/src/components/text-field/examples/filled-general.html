<div data-ok-text-field data-ok-variant="filled" data-ok-size="medium" data-ok-color="default" data-ok-margin="none" data-ok-full-width>
  <label data-ok-text-field-label for="filled-inactive">Inactive</label>
  <div data-ok-text-field-control>
    <input id="filled-inactive" data-ok-text-field-input placeholder=" ">
  </div>
</div>
<div data-ok-text-field data-ok-variant="filled" data-ok-size="medium" data-ok-color="default" data-ok-margin="none" data-ok-full-width>
  <label data-ok-text-field-label for="filled-activated">Activated<span data-ok-text-field-asterisk aria-hidden="true"> *</span></label>
  <div data-ok-text-field-control>
    <input id="filled-activated" data-ok-text-field-input required placeholder=" " value="Hello world">
  </div>
</div>
<div data-ok-text-field data-ok-variant="filled" data-ok-size="medium" data-ok-color="default" data-ok-margin="none" data-ok-full-width>
  <label data-ok-text-field-label for="filled-password">Password</label>
  <div data-ok-text-field-control>
    <input id="filled-password" data-ok-text-field-input autocomplete="current-password" type="password" placeholder=" " value="Hello world">
  </div>
</div>
<div data-ok-text-field data-ok-variant="filled" data-ok-size="medium" data-ok-color="default" data-ok-margin="none" data-ok-full-width>
  <label data-ok-text-field-label for="filled-disabled">Disabled</label>
  <div data-ok-text-field-control>
    <input id="filled-disabled" data-ok-text-field-input disabled placeholder=" " value="Hello world">
  </div>
</div>
<div data-ok-text-field data-ok-variant="filled" data-ok-size="medium" data-ok-color="default" data-ok-margin="none" data-ok-full-width>
  <div data-ok-text-field-control>
    <input id="filled-no-label" data-ok-text-field-input aria-label="Filled input" placeholder="Filled input">
  </div>
</div>
