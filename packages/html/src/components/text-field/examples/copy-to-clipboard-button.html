<div data-ok-text-field data-ok-variant="outlined" data-ok-size="medium" data-ok-color="default" data-ok-full-width data-ok-margin="none">
  <label data-ok-text-field-label for="copy-link">Link</label>
  <div data-ok-text-field-control>
    <input id="copy-link" data-ok-text-field-input placeholder=" " value="https://www.npmjs.com/package/@owlky/react">
    <span data-ok-text-field-adornment="end"><button type="button" data-ok-icon-button data-ok-color="default" data-ok-size="md" data-ok-edge="end" aria-label="Copy" data-ok-clipboard-copy data-ok-clipboard-toast="copy-done" data-ok-clipboard-error-toast="copy-failed"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3.5" y="7.5" width="12" height="13" rx="2.5" fill="currentColor"></rect><path d="M8.5 4.5h8a3 3 0 0 1 3 3v9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path></svg></button></span>

      <legend>
        <span>Link</span>
      </legend>

</div>
<section data-ok-toaster data-ok-position="top-right" data-ok-close-button aria-label="Notifications">

      <div data-ok-toast-title>Copied!</div>
    </div>
    <button type="button" data-ok-toast-close aria-label="Close"><svg data-ok-icon="close-linear" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M19.01 5L5.01 19" /><path d="M19 19L5 5" /></svg></button>
  </li>
</template>
<template id="copy-failed">

    <span data-ok-toast-icon aria-hidden="true"><svg data-ok-icon="danger-circle-linear" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-linecap="round"><circle cx="12" cy="12" r="10" /><path d="M12 7V13" /><path stroke-linejoin="round" d="M12 16H12" /></svg></span>

    <button type="button" data-ok-toast-close aria-label="Close"><svg data-ok-icon="close-linear" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M19.01 5L5.01 19" /><path d="M19 19L5 5" /></svg></button>
  </li>
</template>
