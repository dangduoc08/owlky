<div class="sb-lightbox-gallery">
  <button type="button" data-ok-lightbox-trigger data-ok-lightbox-open="lightbox-lightbox" data-ok-index="0" aria-haspopup="dialog"><img src="lightbox/photo-1.svg" alt="Mountain lake at sunrise"/></button>
  <button type="button" data-ok-lightbox-trigger data-ok-lightbox-open="lightbox-lightbox" data-ok-index="1" aria-haspopup="dialog"><img src="lightbox/photo-2.svg" alt="Neon arches"/></button>
  <button type="button" data-ok-lightbox-trigger data-ok-lightbox-open="lightbox-lightbox" data-ok-index="2" aria-haspopup="dialog"><img src="lightbox/photo-3.svg" alt="Forest in the fog"/></button>
  <button type="button" data-ok-lightbox-trigger data-ok-lightbox-open="lightbox-lightbox" data-ok-index="3" aria-haspopup="dialog"><img src="lightbox/photo-4.svg" alt="Desert road"/></button>
  <button type="button" data-ok-lightbox-trigger data-ok-lightbox-open="lightbox-lightbox" data-ok-index="4" aria-haspopup="dialog"><img src="lightbox/video-poster.svg" alt="Color bands (video)"/></button>
</div>
<dialog id="lightbox-lightbox" data-ok-lightbox data-ok-image-fit="contain" data-ok-description-text-align="start" data-ok-thumbnails-position="bottom" data-ok-thumbnails-image-fit="contain" data-ok-theme="dark" aria-label="Lightbox">
  <section aria-roledescription="carousel" data-ok-carousel data-ok-align="center" data-ok-axis="x" data-ok-contain-scroll="trimSnaps" data-ok-effect="none" data-ok-loop data-ok-duration="25" data-ok-autoplay-delay="3000" data-ok-play-on-init="false" data-ok-stop-on-interaction="false" data-ok-stop-on-mouse-enter="false" data-ok-stop-on-focus-in="false" aria-label="Photo gallery" data-ok-lightbox-carousel>
    <div data-ok-carousel-stage>
      <div data-ok-carousel-viewport tabindex="0">
        <div data-ok-carousel-container>
          <div role="group" aria-roledescription="slide" aria-label="1 of 5" data-ok-carousel-slide data-ok-snapped data-ok-lightbox-slide>
            <div data-ok-lightbox-zoom>
              <img data-ok-lightbox-image src="lightbox/photo-1.svg" alt="Mountain lake at sunrise" width="2400" height="1600" loading="lazy" draggable="false"/>
            </div>
            <h2 data-ok-lightbox-caption="title">Mountain lake</h2>
            <div data-ok-lightbox-caption="description">
              <div data-ok-lightbox-description-text>Sunrise over the ridge, seen from the eastern shore.</div>
            </div>
          </div>
          <div role="group" aria-roledescription="slide" aria-label="2 of 5" data-ok-carousel-slide data-ok-lightbox-slide>
            <div data-ok-lightbox-zoom>
              <img data-ok-lightbox-image src="lightbox/photo-2.svg" alt="Neon arches" width="2400" height="1600" loading="lazy" draggable="false"/>
            </div>
            <h2 data-ok-lightbox-caption="title">Neon arches</h2>
            <div data-ok-lightbox-caption="description">
              <div data-ok-lightbox-description-text>Four arches of light in a night market.</div>
            </div>
          </div>
          <div role="group" aria-roledescription="slide" aria-label="3 of 5" data-ok-carousel-slide data-ok-lightbox-slide>
            <div data-ok-lightbox-zoom>
              <img data-ok-lightbox-image src="lightbox/photo-3.svg" alt="Forest in the fog" width="2400" height="1600" loading="lazy" draggable="false"/>
            </div>
            <h2 data-ok-lightbox-caption="title">Forest in the fog</h2>
            <div data-ok-lightbox-caption="description">
              <div data-ok-lightbox-description-text>Morning fog between the pines.</div>
            </div>
          </div>
          <div role="group" aria-roledescription="slide" aria-label="4 of 5" data-ok-carousel-slide data-ok-lightbox-slide>
            <div data-ok-lightbox-zoom>
              <img data-ok-lightbox-image src="lightbox/photo-4.svg" alt="Desert road" width="2400" height="1600" loading="lazy" draggable="false"/>
            </div>
            <h2 data-ok-lightbox-caption="title">Desert road</h2>
            <div data-ok-lightbox-caption="description">
              <div data-ok-lightbox-description-text>A straight road toward the setting sun.</div>
            </div>
          </div>
          <div role="group" aria-roledescription="slide" aria-label="5 of 5" data-ok-carousel-slide data-ok-lightbox-slide>
            <div data-ok-lightbox-zoom>
              <video data-ok-lightbox-video poster="lightbox/video-poster.svg" width="1280" height="720" controls playsinline>
                <source src="lightbox/video.webm" type="video/webm"/>
                <track src="lightbox/video.vtt" kind="captions" srclang="en" label="English"/>
              </video>
            </div>
            <h2 data-ok-lightbox-caption="title">Color bands</h2>
            <div data-ok-lightbox-caption="description">
              <div data-ok-lightbox-description-text>A short animated clip.</div>
            </div>
          </div>
        </div>
        <span data-ok-carousel-live aria-live="polite" aria-atomic="true"></span>
      </div>
      <div data-ok-lightbox-toolbar>
        <button type="button" data-ok-icon-button data-ok-color="default" data-ok-size="md" data-ok-lightbox-zoom-in aria-label="Zoom in"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5M11 8v6M8 11h6"></path></svg></button>
        <button type="button" data-ok-icon-button data-ok-color="default" data-ok-size="md" data-ok-lightbox-zoom-out aria-label="Zoom out"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5M8 11h6"></path></svg></button>
        <button type="button" data-ok-icon-button data-ok-color="default" data-ok-size="md" data-ok-lightbox-rotate-ccw aria-label="Rotate counterclockwise"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3M4.5 4v4.5H9"></path></svg></button>
        <button type="button" data-ok-icon-button data-ok-color="default" data-ok-size="md" data-ok-lightbox-rotate-cw aria-label="Rotate clockwise"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 12A7.5 7.5 0 1 1 17.3 6.7M19.5 4v4.5H15"></path></svg></button>
        <button type="button" data-ok-icon-button data-ok-color="default" data-ok-size="md" data-ok-carousel-play data-ok-lightbox-slideshow><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" data-ok-carousel-play-label="play"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"></path></svg><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" data-ok-carousel-play-label="pause"><path d="M8.5 5.5v13M15.5 5.5v13" stroke-width="2.6"></path></svg><span data-ok-carousel-play-label="play">Play</span><span data-ok-carousel-play-label="pause">Pause</span></button>
        <button type="button" data-ok-icon-button data-ok-color="default" data-ok-size="md" data-ok-lightbox-fullscreen><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" data-ok-lightbox-label="enter"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"></path></svg><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" data-ok-lightbox-label="exit"><path d="M9 4v5H4M15 4v5h5M20 15h-5v5M4 15h5v5"></path></svg><span data-ok-lightbox-label="enter">Enter Fullscreen</span><span data-ok-lightbox-label="exit">Exit Fullscreen</span></button>
        <button type="button" data-ok-icon-button data-ok-color="default" data-ok-size="md" data-ok-lightbox-download aria-label="Download"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m-5-5 5 5 5-5M5 20h14"></path></svg></button>
        <button type="button" data-ok-icon-button data-ok-color="default" data-ok-size="md" data-ok-lightbox-share aria-label="Share"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5.5" r="2.5"></circle><circle cx="6" cy="12" r="2.5"></circle><circle cx="18" cy="18.5" r="2.5"></circle><path d="m8.2 10.8 7.6-4.1M8.2 13.2l7.6 4.1"></path></svg></button>
        <button type="button" data-ok-icon-button data-ok-color="default" data-ok-size="md" data-ok-lightbox-captions><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"></rect><path d="M7 15h4M14 15h3M7 11.5h10"></path></svg><span data-ok-lightbox-label="hide">Hide captions</span><span data-ok-lightbox-label="show">Show captions</span></button>
        <button type="button" data-ok-icon-button data-ok-color="default" data-ok-size="md" data-ok-lightbox-thumbnails-toggle><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="18" height="12" rx="2"></rect><path d="M3.5 20h3M10.5 20h3M17.5 20h3"></path></svg><span data-ok-lightbox-label="hide">Hide thumbnails</span><span data-ok-lightbox-label="show">Show thumbnails</span></button>
        <span data-ok-lightbox-counter><span data-ok-lightbox-counter-current>1</span> / <span data-ok-lightbox-counter-total>5</span></span>
        <button type="button" data-ok-icon-button data-ok-color="default" data-ok-size="md" data-ok-lightbox-close aria-label="Close"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
      </div>
      <button type="button" data-ok-icon-button data-ok-color="default" data-ok-size="md" data-ok-carousel-prev data-ok-lightbox-nav aria-label="Previous"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></button>
      <button type="button" data-ok-icon-button data-ok-color="default" data-ok-size="md" data-ok-carousel-next data-ok-lightbox-nav aria-label="Next"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg></button>
    </div>
    <div data-ok-carousel-thumbs data-ok-orientation="horizontal" role="group" aria-label="Thumbnails" data-ok-lightbox-thumbnails>
      <button type="button" data-ok-carousel-thumb aria-label="1 of 5" aria-current="true"><img src="lightbox/photo-1.svg" alt="" loading="lazy" draggable="false"/></button>
      <button type="button" data-ok-carousel-thumb aria-label="2 of 5"><img src="lightbox/photo-2.svg" alt="" loading="lazy" draggable="false"/></button>
      <button type="button" data-ok-carousel-thumb aria-label="3 of 5"><img src="lightbox/photo-3.svg" alt="" loading="lazy" draggable="false"/></button>
      <button type="button" data-ok-carousel-thumb aria-label="4 of 5"><img src="lightbox/photo-4.svg" alt="" loading="lazy" draggable="false"/></button>
      <button type="button" data-ok-carousel-thumb aria-label="5 of 5"><img src="lightbox/video-poster.svg" alt="" loading="lazy" draggable="false"/><span data-ok-lightbox-thumbnail-play><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor" fill-opacity="0.32"></circle><path d="M10 8.3v7.4l6-3.7z" fill="currentColor"></path></svg></span></button>
    </div>
    <span data-ok-lightbox-live aria-live="polite" aria-atomic="true"></span>
  </section>
</dialog>
