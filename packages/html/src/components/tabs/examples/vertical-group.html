<div class="sb-tabs-demo sb-tabs-demo-vertical">
  <div data-ok-tabs data-ok-variant="standard" data-ok-orientation="vertical" data-ok-text-color="inherit" data-ok-indicator-color="inherit" data-ok-scroll-buttons="auto">
    <div data-ok-tabs-scroller>
      <div role="tablist" data-ok-tabs-list aria-label="Vertical" aria-orientation="vertical">
        <button type="button" role="tab" data-ok-tab id="tabs-vertical-tab-one" aria-controls="tabs-vertical-panel-one" value="one" aria-selected="true" tabindex="0"><span data-ok-tab-label>Item one</span></button>
        <button type="button" role="tab" data-ok-tab id="tabs-vertical-tab-two" aria-controls="tabs-vertical-panel-two" value="two" aria-selected="false" tabindex="-1"><span data-ok-tab-label>Item two</span></button>
        <button type="button" role="tab" data-ok-tab id="tabs-vertical-tab-three" aria-controls="tabs-vertical-panel-three" value="three" aria-selected="false" tabindex="-1"><span data-ok-tab-label>Item three</span></button>
      </div>
      <span data-ok-tabs-indicator></span>
    </div>
  </div>
  <div role="tabpanel" data-ok-tab-panel tabindex="0" id="tabs-vertical-panel-one" aria-labelledby="tabs-vertical-tab-one">Item one</div>
  <div role="tabpanel" data-ok-tab-panel tabindex="0" id="tabs-vertical-panel-two" aria-labelledby="tabs-vertical-tab-two" hidden>Item two</div>
  <div role="tabpanel" data-ok-tab-panel tabindex="0" id="tabs-vertical-panel-three" aria-labelledby="tabs-vertical-tab-three" hidden>Item three</div>
</div>
