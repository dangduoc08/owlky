<div data-ok-tabs data-ok-variant="standard" data-ok-orientation="horizontal" data-ok-text-color="inherit" data-ok-indicator-color="inherit" data-ok-scroll-buttons="auto" data-ok-segmented>
  <div data-ok-tabs-scroller>
    <div role="tablist" data-ok-tabs-list aria-label="Dynamic width">
      <button type="button" role="tab" data-ok-tab value="0" aria-selected="true" tabindex="0"><span data-ok-tab-label>Item one</span></button>
      <button type="button" role="tab" data-ok-tab value="1" aria-selected="false" tabindex="-1"><span data-ok-tab-label>Item two</span></button>
      <button type="button" role="tab" data-ok-tab disabled value="2" aria-selected="false" tabindex="-1"><span data-ok-tab-label>Item three</span></button>
      <button type="button" role="tab" data-ok-tab value="3" aria-selected="false" tabindex="-1"><span data-ok-tab-label>Item four</span></button>
    </div>
    <span data-ok-tabs-indicator></span>
  </div>
</div>
