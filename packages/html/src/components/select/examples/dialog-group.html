<button type="button" data-ok-button data-ok-variant="outlined" data-ok-color="inherit" data-ok-size="md" aria-haspopup="dialog" aria-expanded="false" aria-controls="select-dialog" data-ok-dialog-open="select-dialog">
  <span data-ok-button-label>Open select dialog</span>
</button>
<dialog data-ok-dialog data-ok-max-width="sm" data-ok-scroll="paper" aria-labelledby="_R_2_" id="select-dialog">
  <div data-ok-dialog-paper>
    <h2 id="_R_2_" data-ok-dialog-title>Fill the form</h2>
    <div data-ok-dialog-content>
      <div class="sb-select-dialog">
        <div data-ok-form-control class="sb-select">
          <label data-ok-form-label data-ok-input-label for="select-dialog-native">Age</label>
          <div data-ok-select data-ok-variant="outlined" data-ok-size="medium" data-ok-color="default">
            <select data-ok-select-native id="select-dialog-native">
              <option aria-label="None" value="" selected></option>
              <option value="10">Ten</option>
              <option value="20">Twenty</option>
              <option value="30">Thirty</option>
            </select>
            <svg aria-hidden="true" viewBox="0 0 24 24" data-ok-select-icon><path d="m7 10 5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
            <fieldset data-ok-select-outline aria-hidden="true">
              <legend>
                <span>Age</span>
              </legend>
            </fieldset>
          </div>
        </div>
        <div data-ok-form-control class="sb-select">
          <label data-ok-form-label data-ok-input-label id="select-dialog-label" for="select-dialog-age">Age</label>
          <div data-ok-select data-ok-variant="outlined" data-ok-size="medium" data-ok-color="default">
            <div data-ok-select-display role="combobox" tabindex="0" id="select-dialog-age" aria-haspopup="listbox" aria-expanded="false" aria-controls="select-dialog-age-listbox" aria-labelledby="select-dialog-label"></div>
            <input data-ok-select-input aria-hidden="true" tabindex="-1" placeholder=" " value="">
            <svg aria-hidden="true" viewBox="0 0 24 24" data-ok-select-icon><path d="m7 10 5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
            <fieldset data-ok-select-outline aria-hidden="true">
              <legend>
                <span>Age</span>
              </legend>
            </fieldset>
            <div popover="manual" data-ok-popover data-ok-placement="bottom-start" id="select-dialog-age-menu" tabindex="-1">
              <span data-ok-popover-arrow aria-hidden="true"></span>
              <ul data-ok-select-listbox role="listbox" id="select-dialog-age-listbox" aria-labelledby="select-dialog-label">
                <li role="option" tabindex="-1" data-ok-menu-item data-ok-selected aria-selected="true" data-ok-value>
                  <em>None</em>
                </li>
                <li role="option" tabindex="-1" data-ok-menu-item aria-selected="false" data-ok-value="10">Ten</li>
                <li role="option" tabindex="-1" data-ok-menu-item aria-selected="false" data-ok-value="20">Twenty</li>
                <li role="option" tabindex="-1" data-ok-menu-item aria-selected="false" data-ok-value="30">Thirty</li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div data-ok-dialog-actions>
      <button data-ok-dialog-close type="button" data-ok-button data-ok-variant="outlined" data-ok-color="inherit" data-ok-size="md">
        <span data-ok-button-label>Cancel</span>
      </button>
      <button data-ok-dialog-close type="button" data-ok-button data-ok-variant="contained" data-ok-color="inherit" data-ok-size="md">
        <span data-ok-button-label>Ok</span>
      </button>
    </div>
  </div>
</dialog>
