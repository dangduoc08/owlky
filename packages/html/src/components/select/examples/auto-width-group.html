<div data-ok-form-control class="sb-select-auto">
  <label data-ok-form-label data-ok-input-label id="select-autowidth-label" for="select-autowidth">Age</label>
  <div data-ok-select data-ok-variant="outlined" data-ok-size="medium" data-ok-color="default" data-ok-auto-width>
    <div data-ok-select-display role="combobox" tabindex="0" id="select-autowidth" aria-haspopup="listbox" aria-expanded="false" aria-controls="select-autowidth-listbox" aria-labelledby="select-autowidth-label"></div>
    <input data-ok-select-input aria-hidden="true" tabindex="-1" placeholder=" " value="">
    <svg aria-hidden="true" viewBox="0 0 24 24" data-ok-select-icon><path d="m7 10 5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    <fieldset data-ok-select-outline aria-hidden="true">
      <legend>
        <span>Age</span>
      </legend>
    </fieldset>
    <div popover="manual" data-ok-popover data-ok-placement="bottom-start" id="select-autowidth-menu" tabindex="-1">
      <span data-ok-popover-arrow aria-hidden="true"></span>
      <ul data-ok-select-listbox role="listbox" id="select-autowidth-listbox" aria-labelledby="select-autowidth-label">
        <li role="option" tabindex="-1" data-ok-menu-item data-ok-selected aria-selected="true" data-ok-value>
          <em>None</em>
        </li>
        <li role="option" tabindex="-1" data-ok-menu-item aria-selected="false" data-ok-value="10">Twenty</li>
        <li role="option" tabindex="-1" data-ok-menu-item aria-selected="false" data-ok-value="21">Twenty one</li>
        <li role="option" tabindex="-1" data-ok-menu-item aria-selected="false" data-ok-value="22">Twenty one and a half</li>
      </ul>
    </div>
  </div>
</div>
