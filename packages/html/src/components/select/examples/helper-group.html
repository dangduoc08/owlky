<div data-ok-form-control class="sb-select">
  <label data-ok-form-label data-ok-input-label id="select-helper-label" for="select-helper">Age</label>
  <div data-ok-select data-ok-variant="outlined" data-ok-size="medium" data-ok-color="default">
    <div data-ok-select-display role="combobox" tabindex="0" id="select-helper" aria-haspopup="listbox" aria-expanded="false" aria-controls="select-helper-listbox" aria-labelledby="select-helper-label" aria-describedby="select-helper-text"></div>
    <input data-ok-select-input aria-hidden="true" tabindex="-1" placeholder=" " value="">
    <svg aria-hidden="true" viewBox="0 0 24 24" data-ok-select-icon><path d="m7 10 5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    <fieldset data-ok-select-outline aria-hidden="true">
      <legend>
        <span>Age</span>
      </legend>
    </fieldset>
    <div popover="manual" data-ok-popover data-ok-paper data-ok-placement="bottom-start" id="select-helper-menu" tabindex="-1">
      <span data-ok-popover-arrow aria-hidden="true"></span>
      <ul data-ok-select-listbox role="listbox" id="select-helper-listbox" aria-labelledby="select-helper-label">
        <li role="option" tabindex="-1" data-ok-menu-item data-ok-selected aria-selected="true" data-ok-value>
          <em>None</em>
        </li>
        <li role="option" tabindex="-1" data-ok-menu-item aria-selected="false" data-ok-value="10">Ten</li>
        <li role="option" tabindex="-1" data-ok-menu-item aria-selected="false" data-ok-value="20">Twenty</li>
        <li role="option" tabindex="-1" data-ok-menu-item aria-selected="false" data-ok-value="30">Thirty</li>
      </ul>
    </div>
  </div>
  <p data-ok-form-helper-text id="select-helper-text">With label + helper text</p>
</div>
<div data-ok-form-control class="sb-select">
  <div data-ok-select data-ok-variant="outlined" data-ok-size="medium" data-ok-color="default" data-ok-display-empty>
    <div data-ok-select-display role="combobox" tabindex="0" id="select-empty" aria-haspopup="listbox" aria-expanded="false" aria-controls="select-empty-listbox" aria-label="Without label" aria-describedby="select-empty-text"><em>None</em></div>
    <input data-ok-select-input aria-hidden="true" tabindex="-1" placeholder=" " value="">
    <svg aria-hidden="true" viewBox="0 0 24 24" data-ok-select-icon><path d="m7 10 5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    <fieldset data-ok-select-outline aria-hidden="true">
    </fieldset>
    <div popover="manual" data-ok-popover data-ok-paper data-ok-placement="bottom-start" id="select-empty-menu" tabindex="-1">
      <span data-ok-popover-arrow aria-hidden="true"></span>
      <ul data-ok-select-listbox role="listbox" id="select-empty-listbox">
        <li role="option" tabindex="-1" data-ok-menu-item data-ok-selected aria-selected="true" data-ok-value>
          <em>None</em>
        </li>
        <li role="option" tabindex="-1" data-ok-menu-item aria-selected="false" data-ok-value="10">Ten</li>
        <li role="option" tabindex="-1" data-ok-menu-item aria-selected="false" data-ok-value="20">Twenty</li>
        <li role="option" tabindex="-1" data-ok-menu-item aria-selected="false" data-ok-value="30">Thirty</li>
      </ul>
    </div>
  </div>
  <p data-ok-form-helper-text id="select-empty-text">Without label</p>
</div>
