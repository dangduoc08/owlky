<fieldset data-ok-form-control>
  <legend data-ok-form-label id="fc-gender-label">Gender</legend>
  <div role="radiogroup" data-ok-radio-group aria-labelledby="fc-gender-label">
    <label data-ok-form-control-label data-ok-label-placement="end">
      <span data-ok-radio data-ok-color="primary" data-ok-size="medium">
        <input type="radio" data-ok-radio-input name="fc-gender" checked value="female">
        <span data-ok-radio-icon="unchecked" aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.25" fill="none" stroke="currentColor" stroke-width="1.5"></circle></svg></span>
        <span data-ok-radio-icon="checked" aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 6a4 4 0 1 0 0 8 4 4 0 0 0 0-8z" fill="currentColor" fill-rule="evenodd"></path></svg></span>
      </span>
      <span data-ok-form-control-label-text>Female</span>
    </label>
    <label data-ok-form-control-label data-ok-label-placement="end">
      <span data-ok-radio data-ok-color="primary" data-ok-size="medium">
        <input type="radio" data-ok-radio-input name="fc-gender" value="male">
        <span data-ok-radio-icon="unchecked" aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.25" fill="none" stroke="currentColor" stroke-width="1.5"></circle></svg></span>
        <span data-ok-radio-icon="checked" aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 6a4 4 0 1 0 0 8 4 4 0 0 0 0-8z" fill="currentColor" fill-rule="evenodd"></path></svg></span>
      </span>
      <span data-ok-form-control-label-text>Male</span>
    </label>
    <label data-ok-form-control-label data-ok-label-placement="end">
      <span data-ok-radio data-ok-color="primary" data-ok-size="medium">
        <input type="radio" data-ok-radio-input name="fc-gender" value="other">
        <span data-ok-radio-icon="unchecked" aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.25" fill="none" stroke="currentColor" stroke-width="1.5"></circle></svg></span>
        <span data-ok-radio-icon="checked" aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 6a4 4 0 1 0 0 8 4 4 0 0 0 0-8z" fill="currentColor" fill-rule="evenodd"></path></svg></span>
      </span>
      <span data-ok-form-control-label-text>Other</span>
    </label>
  </div>
</fieldset>
