<fieldset data-ok-form-control data-ok-color="primary" data-ok-focused>
  <legend data-ok-form-label>Theme</legend>
  <div data-ok-form-group data-ok-row>
    <label data-ok-form-control-label data-ok-label-placement="end">
      <span data-ok-switch data-ok-color="primary" data-ok-size="medium">
        <input type="checkbox" role="switch" data-ok-switch-input name="dark">
        <span data-ok-switch-track aria-hidden="true"></span>
        <span data-ok-switch-thumb aria-hidden="true"></span>
      </span>
      <span data-ok-form-control-label-text>Dark mode</span>
    </label>
    <label data-ok-form-control-label data-ok-label-placement="end">
      <span data-ok-switch data-ok-color="primary" data-ok-size="medium">
        <input type="checkbox" role="switch" data-ok-switch-input name="compact" checked>
        <span data-ok-switch-track aria-hidden="true"></span>
        <span data-ok-switch-thumb aria-hidden="true"></span>
      </span>
      <span data-ok-form-control-label-text>Compact</span>
    </label>
  </div>
</fieldset>
