<fieldset data-ok-form-control data-ok-required>
  <legend data-ok-form-label id="fc-plan-label">Plan<span data-ok-form-label-asterisk aria-hidden="true">*</span></legend>
  <div role="radiogroup" data-ok-radio-group data-ok-row aria-labelledby="fc-plan-label" aria-describedby="fc-plan-helper" aria-required="true">
    <label data-ok-form-control-label data-ok-label-placement="end">
      <span data-ok-radio data-ok-color="primary" data-ok-size="medium">
        <input type="radio" data-ok-radio-input name="fc-plan" value="free">
        <span data-ok-radio-icon="unchecked" aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.25" fill="none" stroke="currentColor" stroke-width="1.5"></circle></svg></span>
        <span data-ok-radio-icon="checked" aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 6a4 4 0 1 0 0 8 4 4 0 0 0 0-8z" fill="currentColor" fill-rule="evenodd"></path></svg></span>
      </span>
      <span data-ok-form-control-label-text>Free</span>
    </label>
    <label data-ok-form-control-label data-ok-label-placement="end">
      <span data-ok-radio data-ok-color="primary" data-ok-size="medium">
        <input type="radio" data-ok-radio-input name="fc-plan" value="pro">
        <span data-ok-radio-icon="unchecked" aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.25" fill="none" stroke="currentColor" stroke-width="1.5"></circle></svg></span>
        <span data-ok-radio-icon="checked" aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 6a4 4 0 1 0 0 8 4 4 0 0 0 0-8z" fill="currentColor" fill-rule="evenodd"></path></svg></span>
      </span>
      <span data-ok-form-control-label-text>Pro</span>
    </label>
  </div>
  <p data-ok-form-helper-text id="fc-plan-helper">Choose a plan to continue</p>
</fieldset>
