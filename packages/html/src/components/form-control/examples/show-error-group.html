<fieldset data-ok-form-control data-ok-error>
  <legend data-ok-form-label id="fc-quiz-label">Pop quiz: a radio group lets you pick…</legend>
  <div role="radiogroup" data-ok-radio-group aria-labelledby="fc-quiz-label" aria-describedby="fc-quiz-helper" aria-invalid="true">
    <label data-ok-form-control-label data-ok-label-placement="end">
      <span data-ok-radio data-ok-color="primary" data-ok-size="medium">
        <input type="radio" data-ok-radio-input name="fc-quiz" value="one">
        <span data-ok-radio-icon="unchecked" aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.25" fill="none" stroke="currentColor" stroke-width="1.5"></circle></svg></span>
        <span data-ok-radio-icon="checked" aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 6a4 4 0 1 0 0 8 4 4 0 0 0 0-8z" fill="currentColor" fill-rule="evenodd"></path></svg></span>
      </span>
      <span data-ok-form-control-label-text>Exactly one option</span>
    </label>
    <label data-ok-form-control-label data-ok-label-placement="end">
      <span data-ok-radio data-ok-color="primary" data-ok-size="medium">
        <input type="radio" data-ok-radio-input name="fc-quiz" checked value="many">
        <span data-ok-radio-icon="unchecked" aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.25" fill="none" stroke="currentColor" stroke-width="1.5"></circle></svg></span>
        <span data-ok-radio-icon="checked" aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 6a4 4 0 1 0 0 8 4 4 0 0 0 0-8z" fill="currentColor" fill-rule="evenodd"></path></svg></span>
      </span>
      <span data-ok-form-control-label-text>Many options</span>
    </label>
  </div>
  <p data-ok-form-helper-text id="fc-quiz-helper">Sorry, wrong answer!</p>
</fieldset>
