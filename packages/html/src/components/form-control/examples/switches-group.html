<fieldset data-ok-form-control aria-describedby="fc-switches-helper">
  <legend data-ok-form-label>Assign responsibility</legend>
  <div data-ok-form-group>
    <label data-ok-form-control-label data-ok-label-placement="end">
      <span data-ok-switch data-ok-color="primary" data-ok-size="medium">
        <input type="checkbox" role="switch" data-ok-switch-input name="gilad" checked>
        <span data-ok-switch-track aria-hidden="true"></span>
        <span data-ok-switch-thumb aria-hidden="true"></span>
      </span>
      <span data-ok-form-control-label-text>Gilad Gray</span>
    </label>
    <label data-ok-form-control-label data-ok-label-placement="end">
      <span data-ok-switch data-ok-color="primary" data-ok-size="medium">
        <input type="checkbox" role="switch" data-ok-switch-input name="jason">
        <span data-ok-switch-track aria-hidden="true"></span>
        <span data-ok-switch-thumb aria-hidden="true"></span>
      </span>
      <span data-ok-form-control-label-text>Jason Killian</span>
    </label>
    <label data-ok-form-control-label data-ok-label-placement="end">
      <span data-ok-switch data-ok-color="primary" data-ok-size="medium">
        <input type="checkbox" role="switch" data-ok-switch-input name="antoine" checked>
        <span data-ok-switch-track aria-hidden="true"></span>
        <span data-ok-switch-thumb aria-hidden="true"></span>
      </span>
      <span data-ok-form-control-label-text>Antoine Llorca</span>
    </label>
  </div>
  <p data-ok-form-helper-text id="fc-switches-helper">Be careful</p>
</fieldset>
