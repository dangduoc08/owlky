<div data-ok-form-control>
  <label data-ok-form-label for="fc-mentions">Email notifications</label>
  <span data-ok-switch data-ok-color="primary" data-ok-size="medium">
    <input type="checkbox" role="switch" data-ok-switch-input id="fc-mentions" aria-describedby="fc-mentions-helper" checked>
    <span data-ok-switch-track aria-hidden="true"></span>
    <span data-ok-switch-thumb aria-hidden="true"></span>
  </span>
  <p data-ok-form-helper-text id="fc-mentions-helper">Get an email when someone mentions you.</p>
</div>
