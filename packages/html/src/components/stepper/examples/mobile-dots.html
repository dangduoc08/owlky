<div class="sb-mobile-card">
  <div class="sb-mobile-card-body" data-ok-mobile-stepper-panel="mobile-stepper-dots">
    <h6 data-ok-typography data-ok-variant="subtitle1">Choose a plan</h6>
    <p data-ok-typography data-ok-variant="body2" data-ok-color="textSecondary">Pick the plan and the billing period that suit your team.</p>
  </div>
  <div class="sb-mobile-card-body" data-ok-mobile-stepper-panel="mobile-stepper-dots" hidden>
    <h6 data-ok-typography data-ok-variant="subtitle1">Add details</h6>
    <p data-ok-typography data-ok-variant="body2" data-ok-color="textSecondary">Name the project and invite the people who will work on it.</p>
  </div>
  <div class="sb-mobile-card-body" data-ok-mobile-stepper-panel="mobile-stepper-dots" hidden>
    <h6 data-ok-typography data-ok-variant="subtitle1">Review and confirm</h6>
    <p data-ok-typography data-ok-variant="body2" data-ok-color="textSecondary">Check the summary, then confirm to create the project.</p>
  </div>
  <div id="mobile-stepper-dots" data-ok-mobile-stepper data-ok-variant="dots" data-ok-position="static" data-ok-steps="3" data-ok-active-step="0">

    <span data-ok-mobile-stepper-dots role="img" aria-label="Step 1 of 3"><span data-ok-mobile-stepper-dot data-ok-active></span><span data-ok-mobile-stepper-dot></span><span data-ok-mobile-stepper-dot></span></span>
    <button data-ok-mobile-stepper-next type="button" data-ok-button data-ok-variant="text" data-ok-color="inherit" data-ok-size="sm"><span data-ok-button-label>Next</span><span data-ok-button-icon="end" aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6" /></svg></span></button>
  </div>
</div>
