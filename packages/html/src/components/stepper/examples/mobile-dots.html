<div data-ok-paper data-ok-variant="outlined" data-ok-elevation="1" class="sb-mobile-card">
  <div class="sb-mobile-card-body" data-ok-mobile-stepper-panel="mobile-stepper-dots">
    <h6 data-ok-typography data-ok-variant="subtitle1">Choose a plan</h6>
    <p data-ok-typography data-ok-variant="body2" data-ok-color="textSecondary">Pick the plan and the billing period that suit your team.</p>
  </div>
  <div class="sb-mobile-card-body" data-ok-mobile-stepper-panel="mobile-stepper-dots" hidden>
    <h6 data-ok-typography data-ok-variant="subtitle1">Add details</h6>
    <p data-ok-typography data-ok-variant="body2" data-ok-color="textSecondary">Name the project and invite the people who will work on it.</p>
  </div>
  <div class="sb-mobile-card-body" data-ok-mobile-stepper-panel="mobile-stepper-dots" hidden>
    <h6 data-ok-typography data-ok-variant="subtitle1">Review and confirm</h6>
    <p data-ok-typography data-ok-variant="body2" data-ok-color="textSecondary">Check the summary, then confirm to create the project.</p>
  </div>
  <hr data-ok-divider data-ok-variant="fullWidth" data-ok-orientation="horizontal">
  <div id="mobile-stepper-dots" data-ok-mobile-stepper data-ok-variant="dots" data-ok-position="static" data-ok-steps="3" data-ok-active-step="0">
    <button data-ok-mobile-stepper-back type="button" data-ok-button data-ok-variant="text" data-ok-color="inherit" data-ok-size="sm" disabled><span data-ok-button-icon="start" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" width="1em" height="1em" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 5L9 12L15 19"/></svg></span><span data-ok-button-label>Back</span></button>
    <span data-ok-mobile-stepper-dots role="img" aria-label="Step 1 of 3"><span data-ok-mobile-stepper-dot data-ok-active></span><span data-ok-mobile-stepper-dot></span><span data-ok-mobile-stepper-dot></span></span>
    <button data-ok-mobile-stepper-next type="button" data-ok-button data-ok-variant="text" data-ok-color="inherit" data-ok-size="sm"><span data-ok-button-label>Next</span><span data-ok-button-icon="end" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" width="1em" height="1em" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5L15 12L9 19"/></svg></span></button>
  </div>
</div>
