<button type="button" data-ok-button data-ok-variant="outlined" data-ok-color="success" data-ok-size="md" aria-haspopup="dialog" aria-expanded="false" aria-controls="dialog-transitions" data-ok-dialog-open="dialog-transitions">
  <span data-ok-button-label>Transitions dialog</span>
</button>
<dialog data-ok-dialog data-ok-max-width="sm" data-ok-scroll="paper" aria-labelledby="dialog-transitions-title" id="dialog-transitions">
  <div data-ok-dialog-paper data-ok-motion data-ok-variant="slideInUp" data-ok-trigger="mount">
    <h2 id="dialog-transitions-title" data-ok-dialog-title>Share your location?</h2>
    <div data-ok-dialog-content>
      <p data-ok-dialog-content-text>Apps can use your location to show results near you. You can change this later in Settings.</p>
    </div>
    <div data-ok-dialog-actions>
      <button type="button" data-ok-button data-ok-variant="outlined" data-ok-color="inherit" data-ok-size="md" data-ok-dialog-close>
        <span data-ok-button-label>Not now</span>
      </button>
      <button type="button" data-ok-button data-ok-variant="contained" data-ok-color="inherit" data-ok-size="md" data-ok-dialog-close>
        <span data-ok-button-label>Allow</span>
      </button>
    </div>
  </div>
</dialog>
