<button type="button" data-mt-button data-mt-variant="soft" data-mt-color="warning" data-mt-size="md" aria-haspopup="dialog" data-mt-dialog-open="terms-dialog">Review terms</button>

<dialog id="terms-dialog" data-mt-dialog data-mt-size="sm" data-mt-escape-close="false" data-mt-backdrop-close="false" aria-labelledby="terms-dialog-title">
  <div data-mt-dialog-content>
    <h2 id="terms-dialog-title" data-mt-dialog-title>Accept the new terms</h2>
    <div data-mt-dialog-body>
      <p>Escape and backdrop clicks are disabled: an explicit choice is required.</p>
    </div>
    <div data-mt-dialog-actions>
      <button type="button" data-mt-button data-mt-variant="contained" data-mt-color="primary" data-mt-size="md" data-mt-dialog-close>I accept</button>
    </div>
  </div>
</dialog>
