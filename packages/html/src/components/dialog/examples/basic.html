<button type="button" data-mt-button data-mt-variant="contained" data-mt-color="inherit" data-mt-size="md" aria-haspopup="dialog" data-mt-dialog-open="confirm-dialog">Open dialog</button>

<dialog id="confirm-dialog" data-mt-dialog data-mt-size="xs" aria-labelledby="confirm-dialog-title" aria-describedby="confirm-dialog-description">
  <div data-mt-dialog-content>
    <h2 id="confirm-dialog-title" data-mt-dialog-title>Delete project?</h2>
    <div data-mt-dialog-body>
      <p id="confirm-dialog-description">This permanently deletes the project and its files. You can't undo this.</p>
    </div>
    <div data-mt-dialog-actions>
      <button type="button" data-mt-button data-mt-variant="outlined" data-mt-color="inherit" data-mt-size="md" data-mt-dialog-close>Cancel</button>
      <button type="button" data-mt-button data-mt-variant="contained" data-mt-color="error" data-mt-size="md" data-mt-dialog-close>Delete</button>
    </div>
  </div>
</dialog>
