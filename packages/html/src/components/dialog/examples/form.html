<button type="button" data-mt-button data-mt-variant="outlined" data-mt-color="inherit" data-mt-size="md" aria-haspopup="dialog" data-mt-dialog-open="subscribe-dialog">Subscribe</button>

<dialog id="subscribe-dialog" data-mt-dialog data-mt-size="sm" aria-labelledby="subscribe-dialog-title">
  <form method="dialog" data-mt-dialog-content>
    <h2 id="subscribe-dialog-title" data-mt-dialog-title>Subscribe</h2>
    <div data-mt-dialog-body>
      <p>Get product updates by email. Submitting this form closes the dialog natively.</p>
      <label>Email <input type="email" name="email" autocomplete="email" autofocus /></label>
    </div>
    <div data-mt-dialog-actions>
      <button type="button" data-mt-button data-mt-variant="text" data-mt-color="inherit" data-mt-size="md" data-mt-dialog-close>Cancel</button>
      <button type="submit" data-mt-button data-mt-variant="contained" data-mt-color="primary" data-mt-size="md">Subscribe</button>
    </div>
  </form>
</dialog>
