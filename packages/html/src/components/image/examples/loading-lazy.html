<div class="sb-image-grid">
  <div class="sb-image-item">
    <span class="sb-image-caption">Lazy, blur effect</span>
    <span data-ok-image data-ok-ratio="4/3" data-ok-fit="cover" data-ok-position="center" data-ok-effect="blur">
      <span data-ok-image-placeholder aria-hidden="true"></span>
      <img src="images/image-5.svg" alt="Violet ribbons on black" width="1200" height="900" loading="lazy" decoding="async">
    </span>
  </div>
  <div class="sb-image-item">
    <span class="sb-image-caption">Opacity effect</span>
    <span data-ok-image data-ok-ratio="4/3" data-ok-fit="cover" data-ok-position="center" data-ok-effect="opacity">
      <span data-ok-image-placeholder aria-hidden="true"></span>
      <img src="images/image-6.svg" alt="Orange silk folds" loading="lazy" decoding="async">
    </span>
  </div>
  <div class="sb-image-item">
    <span class="sb-image-caption">Visible by default</span>
    <span data-ok-image data-ok-ratio="4/3" data-ok-fit="cover" data-ok-position="center" data-ok-effect="blur" data-ok-visible-by-default>
      <span data-ok-image-placeholder aria-hidden="true"></span>
      <img src="images/image-7.svg" alt="Sunrise over soft hills" loading="eager" decoding="async">
    </span>
  </div>
  <div class="sb-image-item">
    <span class="sb-image-caption">Responsive sources</span>
    <span data-ok-image data-ok-ratio="4/3" data-ok-fit="cover" data-ok-position="center" data-ok-effect="blur">
      <span data-ok-image-placeholder aria-hidden="true"></span>
      <img src="images/image-8.svg" srcset="images/image-8.svg 1200w, images/image-3.svg 600w" sizes="(min-width: 900px) 25vw, 50vw" alt="Crimson petals in the night" loading="lazy" decoding="async">
    </span>
  </div>
</div>
