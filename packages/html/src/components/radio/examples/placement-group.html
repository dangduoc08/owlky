<div role="radiogroup" data-ok-radio-group data-ok-row aria-label="Placement">
  <label data-ok-form-control-label data-ok-label-placement="top">
    <span data-ok-radio data-ok-color="primary" data-ok-size="medium">
      <input type="radio" data-ok-radio-input value="top" name="placement" checked>
      <span data-ok-radio-icon="unchecked" aria-hidden="true"><span data-ok-radio-ring></span></span>
      <span data-ok-radio-icon="checked" aria-hidden="true"><span data-ok-radio-ring></span></span>
    </span>
    <span data-ok-form-control-label-text>Top</span>
  </label>
  <label data-ok-form-control-label data-ok-label-placement="start">
    <span data-ok-radio data-ok-color="primary" data-ok-size="medium">
      <input type="radio" data-ok-radio-input value="start" name="placement">
      <span data-ok-radio-icon="unchecked" aria-hidden="true"><span data-ok-radio-ring></span></span>
      <span data-ok-radio-icon="checked" aria-hidden="true"><span data-ok-radio-ring></span></span>
    </span>
    <span data-ok-form-control-label-text>Start</span>
  </label>
  <label data-ok-form-control-label data-ok-label-placement="bottom">
    <span data-ok-radio data-ok-color="primary" data-ok-size="medium">
      <input type="radio" data-ok-radio-input value="bottom" name="placement">
      <span data-ok-radio-icon="unchecked" aria-hidden="true"><span data-ok-radio-ring></span></span>
      <span data-ok-radio-icon="checked" aria-hidden="true"><span data-ok-radio-ring></span></span>
    </span>
    <span data-ok-form-control-label-text>Bottom</span>
  </label>
  <label data-ok-form-control-label data-ok-label-placement="end">
    <span data-ok-radio data-ok-color="primary" data-ok-size="medium">
      <input type="radio" data-ok-radio-input value="end" name="placement">
      <span data-ok-radio-icon="unchecked" aria-hidden="true"><span data-ok-radio-ring></span></span>
      <span data-ok-radio-icon="checked" aria-hidden="true"><span data-ok-radio-ring></span></span>
    </span>
    <span data-ok-form-control-label-text>End</span>
  </label>
</div>
