<fieldset data-ok-form-control>
  <legend data-ok-form-label id="radio-colors-label">Colors</legend>
  <div role="radiogroup" data-ok-radio-group aria-labelledby="radio-colors-label">
    <label data-ok-form-control-label data-ok-label-placement="end">
      <span data-ok-radio data-ok-color="default" data-ok-size="medium">
        <input type="radio" data-ok-radio-input value="default" name="colors">
        <span data-ok-radio-icon="unchecked" aria-hidden="true"><span data-ok-radio-ring></span></span>
        <span data-ok-radio-icon="checked" aria-hidden="true"><span data-ok-radio-ring></span></span>
      </span>
      <span data-ok-form-control-label-text>Default</span>
    </label>
    <label data-ok-form-control-label data-ok-label-placement="end">
      <span data-ok-radio data-ok-color="primary" data-ok-size="medium">
        <input type="radio" data-ok-radio-input value="primary" name="colors">
        <span data-ok-radio-icon="unchecked" aria-hidden="true"><span data-ok-radio-ring></span></span>
        <span data-ok-radio-icon="checked" aria-hidden="true"><span data-ok-radio-ring></span></span>
      </span>
      <span data-ok-form-control-label-text>Primary</span>
    </label>
    <label data-ok-form-control-label data-ok-label-placement="end">
      <span data-ok-radio data-ok-color="secondary" data-ok-size="medium">
        <input type="radio" data-ok-radio-input value="secondary" name="colors">
        <span data-ok-radio-icon="unchecked" aria-hidden="true"><span data-ok-radio-ring></span></span>
        <span data-ok-radio-icon="checked" aria-hidden="true"><span data-ok-radio-ring></span></span>
      </span>
      <span data-ok-form-control-label-text>Secondary</span>
    </label>
    <label data-ok-form-control-label data-ok-label-placement="end">
      <span data-ok-radio data-ok-color="info" data-ok-size="medium">
        <input type="radio" data-ok-radio-input value="info" name="colors">
        <span data-ok-radio-icon="unchecked" aria-hidden="true"><span data-ok-radio-ring></span></span>
        <span data-ok-radio-icon="checked" aria-hidden="true"><span data-ok-radio-ring></span></span>
      </span>
      <span data-ok-form-control-label-text>Info</span>
    </label>
    <label data-ok-form-control-label data-ok-label-placement="end">
      <span data-ok-radio data-ok-color="success" data-ok-size="medium">
        <input type="radio" data-ok-radio-input value="success" name="colors">
        <span data-ok-radio-icon="unchecked" aria-hidden="true"><span data-ok-radio-ring></span></span>
        <span data-ok-radio-icon="checked" aria-hidden="true"><span data-ok-radio-ring></span></span>
      </span>
      <span data-ok-form-control-label-text>Success</span>
    </label>
    <label data-ok-form-control-label data-ok-label-placement="end">
      <span data-ok-radio data-ok-color="warning" data-ok-size="medium">
        <input type="radio" data-ok-radio-input value="warning" name="colors">
        <span data-ok-radio-icon="unchecked" aria-hidden="true"><span data-ok-radio-ring></span></span>
        <span data-ok-radio-icon="checked" aria-hidden="true"><span data-ok-radio-ring></span></span>
      </span>
      <span data-ok-form-control-label-text>Warning</span>
    </label>
    <label data-ok-form-control-label data-ok-label-placement="end">
      <span data-ok-radio data-ok-color="error" data-ok-size="medium">
        <input type="radio" data-ok-radio-input value="error" name="colors">
        <span data-ok-radio-icon="unchecked" aria-hidden="true"><span data-ok-radio-ring></span></span>
        <span data-ok-radio-icon="checked" aria-hidden="true"><span data-ok-radio-ring></span></span>
      </span>
      <span data-ok-form-control-label-text>Error</span>
    </label>
    <label data-ok-form-control-label data-ok-label-placement="end">
      <span data-ok-radio data-ok-color="error" data-ok-size="medium">
        <input type="radio" data-ok-radio-input value="disabled" name="colors" disabled>
        <span data-ok-radio-icon="unchecked" aria-hidden="true"><span data-ok-radio-ring></span></span>
        <span data-ok-radio-icon="checked" aria-hidden="true"><span data-ok-radio-ring></span></span>
      </span>
      <span data-ok-form-control-label-text>Disabled</span>
    </label>
  </div>
</fieldset>
