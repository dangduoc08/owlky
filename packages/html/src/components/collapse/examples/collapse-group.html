<div class="sb-collapse-demo">
  <label data-ok-form-control-label data-ok-label-placement="end">
    <span data-ok-switch data-ok-color="primary" data-ok-size="medium">
      <input type="checkbox" data-ok-collapse-toggle="collapse-1 collapse-2 collapse-3 collapse-4" role="switch" data-ok-switch-input>
      <span data-ok-switch-track aria-hidden="true"></span>
      <span data-ok-switch-thumb aria-hidden="true"></span>
    </span>
    <span data-ok-form-control-label-text>Show</span>
  </label>
  <div class="sb-collapse-row">
    <div data-ok-collapse hidden id="collapse-1">
      <div class="sb-collapse-paper">
        <svg aria-hidden="true" width="100" height="100" viewBox="0 0 100 100">
          <polygon points="0,100 50,0 100,100" />
        </svg>
      </div>
    </div>
    <div data-ok-collapse data-ok-collapsed-size="40" hidden id="collapse-2">
      <div class="sb-collapse-paper">
        <svg aria-hidden="true" width="100" height="100" viewBox="0 0 100 100">
          <polygon points="0,100 50,0 100,100" />
        </svg>
      </div>
    </div>
  </div>
  <div class="sb-collapse-row">
    <div class="sb-collapse-half">
      <div data-ok-collapse data-ok-orientation="horizontal" hidden id="collapse-3">
        <div class="sb-collapse-paper">
          <svg aria-hidden="true" width="100" height="100" viewBox="0 0 100 100">
            <polygon points="0,100 50,0 100,100" />
          </svg>
        </div>
      </div>
    </div>
    <div class="sb-collapse-half">
      <div data-ok-collapse data-ok-orientation="horizontal" data-ok-collapsed-size="40" hidden id="collapse-4">
        <div class="sb-collapse-paper">
          <svg aria-hidden="true" width="100" height="100" viewBox="0 0 100 100">
            <polygon points="0,100 50,0 100,100" />
          </svg>
        </div>
      </div>
    </div>
  </div>
</div>
