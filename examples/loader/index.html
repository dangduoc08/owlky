<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The loader's own CSP: scripts and styles from this origin only, no inline code. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'; require-trusted-types-for 'script'"
    />
    <title>Owlky — lazy modules</title>
    <!--
      One stylesheet and one script (ADR-0068): owlky.js holds the light components and loads a
      heavy one (here the Chart) from modules/ next to it when the page holds one. The e2e loader
      spec adds a chart to #later, preloads modules and fails or slows their requests. The chart's
      stylesheet is linked here, as the docs advise for a heavy component on first paint: the
      loader doesn't add it twice, and the page doesn't shift when it arrives.
    -->
    <link rel="stylesheet" href="../../packages/html/dist/owlky.css" />
    <link rel="stylesheet" href="../../packages/html/dist/modules/chart.css" />
    <script src="../../packages/html/dist/owlky.js" defer></script>
  </head>
  <body>
    <main>
      <button type="button" data-ok-button data-ok-variant="contained" data-ok-color="primary" data-ok-size="md">
        <span data-ok-button-label>Light</span>
      </button>
      <figure id="chart" data-ok-chart data-ok-type="bar" data-ok-x-type="category" data-ok-legend="top">
        <table data-ok-chart-data>
          <caption>Deploys per weekday</caption>
          <thead>
            <tr><th scope="col">Category</th><th scope="col" data-ok-color="primary">Deploys</th></tr>
          </thead>
          <tbody>
            <tr><th scope="row">Mon</th><td>14</td></tr>
            <tr><th scope="row">Tue</th><td>22</td></tr>
            <tr><th scope="row">Wed</th><td>19</td></tr>
          </tbody>
        </table>
      </figure>
      <p id="after">Deploys are counted per weekday, across every project.</p>
      <div id="later"></div>
    </main>
  </body>
</html>
