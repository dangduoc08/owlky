<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Owlky — plain HTML example</title>
    <!--
      Real projects use the CDN:
        https://cdn.jsdelivr.net/npm/@owlky/html@0/dist/owlky.css
        https://cdn.jsdelivr.net/npm/@owlky/html@0/dist/owlky.js
      This example points at the local build (run `pnpm build` first) so CI tests what we publish.
    -->
    <link rel="stylesheet" href="../../packages/html/dist/owlky.css" />
    <link rel="stylesheet" href="../../packages/styles/dist/base.css" />
    <script src="../../packages/html/dist/owlky.js" defer></script>
    <style>
      main { max-width: 56rem; margin: 0 auto; padding: 2rem 1rem; display: grid; gap: 1.5rem; }
      h1 { margin: 0; }
      .palette { display: grid; grid-template-columns: repeat(5, 1fr); border-radius: var(--ok-radius-xl); overflow: hidden; box-shadow: var(--ok-shadow-card); }
      .palette div { height: 4rem; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Plain HTML</h1>
        <p>No framework, no build step: one stylesheet, one script, design tokens as CSS variables.</p>
        <button id="theme-toggle" type="button" aria-pressed="false">Dark mode</button>
      </header>

      <section aria-label="Primary palette" class="palette">
        <div style="background: var(--ok-palette-primary-lighter)"></div>
        <div style="background: var(--ok-palette-primary-light)"></div>
        <div id="primary-main" style="background: var(--ok-palette-primary-main)"></div>
        <div style="background: var(--ok-palette-primary-dark)"></div>
        <div style="background: var(--ok-palette-primary-darker)"></div>
      </section>
    </main>

    <script>
      // Page code (not library code): a theme toggle.
      const toggle = document.getElementById("theme-toggle");
      toggle.addEventListener("click", () => {
        const dark = toggle.getAttribute("aria-pressed") !== "true";
        toggle.setAttribute("aria-pressed", String(dark));
        document.documentElement.dataset.okTheme = dark ? "dark" : "light";
      });
    </script>
  </body>
</html>
