<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Strict CSP + Trusted Types: the shipped CSS, runtime and snippets must work unchanged. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'; require-trusted-types-for 'script'"
    />
    <title>Minimal Tailwind — strict CSP check</title>
    <link rel="stylesheet" href="../../packages/html/dist/minimal-tailwind.css" />
    <script src="../../packages/html/dist/minimal-tailwind.js" defer></script>
  </head>
  <body>
    <main>
      <button type="button" data-mt-button data-mt-variant="contained" data-mt-color="primary" data-mt-size="md">
        <span data-mt-button-label>Primary</span>
      </button>
      <button type="button" data-mt-button data-mt-variant="outlined" data-mt-color="error" data-mt-size="sm">
        <span data-mt-button-label>Outlined</span>
      </button>
      <button type="button" data-mt-button data-mt-variant="soft" data-mt-color="info" data-mt-size="lg" data-mt-loading data-mt-loading-position="center" aria-busy="true" disabled>
        <span data-mt-button-loader aria-hidden="true"><span data-mt-button-spinner></span></span>
        <span data-mt-button-label>Loading</span>
      </button>
      <a href="/docs" data-mt-button data-mt-variant="text" data-mt-color="inherit" data-mt-size="md">
        <span data-mt-button-label>Documentation</span>
      </a>
    </main>
  </body>
</html>
