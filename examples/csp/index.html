<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Strict CSP + Trusted Types: the shipped CSS, runtime and snippets must work unchanged. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'; require-trusted-types-for 'script'"
    />
    <title>Owlky — strict CSP check</title>
    <link rel="stylesheet" href="../../packages/html/dist/owlky.css" />
    <script src="../../packages/html/dist/owlky.js" defer></script>
    <script src="../../packages/html/dist/owlky-editor.js" defer></script>
  </head>
  <body>
    <main>
      <button type="button" data-ok-button data-ok-variant="contained" data-ok-color="primary" data-ok-size="md">
        <span data-ok-button-label>Primary</span>
      </button>
      <button type="button" data-ok-button data-ok-variant="outlined" data-ok-color="error" data-ok-size="sm">
        <span data-ok-button-label>Outlined</span>
      </button>
      <button type="button" data-ok-button data-ok-variant="soft" data-ok-color="info" data-ok-size="lg" data-ok-loading data-ok-loading-position="center" aria-busy="true" disabled>
        <span data-ok-button-loader aria-hidden="true"><span data-ok-button-spinner></span></span>
        <span data-ok-button-label>Loading</span>
      </button>
      <span role="progressbar" aria-label="Upload" data-ok-circular-progress data-ok-variant="determinate" data-ok-color="primary" data-ok-size="48" data-ok-thickness="5" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100">
        <svg data-ok-circular-progress-svg aria-hidden="true" viewBox="22 22 44 44"><circle data-ok-circular-progress-circle cx="44" cy="44" r="20.2" stroke-width="3.6" /></svg>
      </span>
      <span role="progressbar" aria-label="Video" data-ok-linear-progress data-ok-variant="buffer" data-ok-color="info" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100" data-ok-value-buffer="40"><span data-ok-linear-progress-dashed></span><span data-ok-linear-progress-bar="1"></span><span data-ok-linear-progress-bar="2"></span></span>
      <label data-ok-form-control-label data-ok-label-placement="end">
        <span data-ok-checkbox data-ok-color="primary" data-ok-size="medium" data-ok-indeterminate>
          <input type="checkbox" data-ok-checkbox-input>
          <span data-ok-checkbox-icon="unchecked" aria-hidden="true"></span>
          <span data-ok-checkbox-icon="checked" aria-hidden="true"></span>
          <span data-ok-checkbox-icon="indeterminate" aria-hidden="true"></span>
        </span>
        <span data-ok-form-control-label-text>Mixed</span>
      </label>
      <label data-ok-form-control-label data-ok-label-placement="end">
        <span data-ok-switch data-ok-color="primary" data-ok-size="medium">
          <input type="checkbox" role="switch" data-ok-switch-input checked>
          <span data-ok-switch-track aria-hidden="true"></span>
          <span data-ok-switch-thumb aria-hidden="true"></span>
        </span>
        <span data-ok-form-control-label-text>Wi-Fi</span>
      </label>
      <div data-ok-text-field data-ok-variant="outlined" data-ok-size="medium" data-ok-color="default" data-ok-margin="none" data-ok-max-rows="3">
        <label data-ok-text-field-label for="csp-notes">Notes</label>
        <div data-ok-text-field-control>
          <textarea id="csp-notes" data-ok-text-field-input rows="1" placeholder=" "></textarea>
          <fieldset data-ok-text-field-outline aria-hidden="true"><legend><span>Notes</span></legend></fieldset>
        </div>
      </div>
      <figure data-ok-chart data-ok-type="area" data-ok-x-type="category" data-ok-curve="smooth" data-ok-legend="top" data-ok-fill="gradient">
        <table data-ok-chart-data>
          <caption>Visits</caption>
          <thead><tr><th scope="col">Day</th><th scope="col">Mobile</th><th scope="col">Desktop</th></tr></thead>
          <tbody>
            <tr><th scope="row">Mon</th><td>12</td><td>30</td></tr>
            <tr><th scope="row">Tue</th><td>18</td><td>26</td></tr>
            <tr><th scope="row">Wed</th><td>25</td><td>31</td></tr>
          </tbody>
        </table>
      </figure>
      <div data-ok-editor>
        <div data-ok-editor-toolbar role="toolbar" aria-label="Formatting" aria-controls="csp-editor">
          <div data-ok-editor-group>
            <button type="button" data-ok-editor-action="bold" aria-label="Bold" aria-pressed="false" tabindex="-1">B</button>
          </div>
        </div>
        <div data-ok-editor-body>
          <div data-ok-editor-content id="csp-editor" role="textbox" aria-multiline="true" aria-label="Story">
            <p>Edit <em>this</em> text.</p>
          </div>
        </div>
      </div>
      <a href="/docs" data-ok-button data-ok-variant="text" data-ok-color="inherit" data-ok-size="md">
        <span data-ok-button-label>Documentation</span>
      </a>
    </main>
  </body>
</html>
