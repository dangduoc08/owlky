<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Strict CSP for the Map (ADR-0025): its worker comes from this origin. Trusted Types are left
         out: MapLibre creates the worker with `new Worker(url)`, which needs a page policy. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'"
    />
    <title>Owlky — Map under a strict CSP</title>
    <link rel="stylesheet" href="../../packages/html/dist/owlky.css" />
    <script src="../../packages/html/dist/owlky.js" defer></script>
    <script src="../../packages/html/dist/owlky-map.js" defer></script>
  </head>
  <body>
    <main>
      <div data-ok-map data-ok-label="Map of France" data-ok-map-style="map-style.json" data-ok-longitude="2.35" data-ok-latitude="46.5" data-ok-zoom="4" data-ok-projection="mercator">
        <div data-ok-map-view></div>
        <div data-ok-map-fallback></div>
        <div data-ok-map-status role="status"></div>
        <div data-ok-map-marker data-ok-longitude="2.35" data-ok-latitude="48.86" data-ok-anchor="bottom" data-ok-color="error" role="button" tabindex="0" aria-label="Paris" data-ok-map-popup-open="csp-paris">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" data-ok-map-pin><path d="M12 2.5A7.5 7.5 0 0 0 4.5 10c0 5.3 6.2 11 6.9 11.6a.9.9 0 0 0 1.2 0c.7-.6 6.9-6.3 6.9-11.6A7.5 7.5 0 0 0 12 2.5Zm0 10.25a2.75 2.75 0 1 1 0-5.5 2.75 2.75 0 0 1 0 5.5Z" fill="currentColor"></path></svg>
        </div>
        <div data-ok-map-popup id="csp-paris" role="dialog" tabindex="-1" aria-label="Paris" data-ok-longitude="2.35" data-ok-latitude="48.86" data-ok-offset="28" hidden>
          <span data-ok-map-popup-tip aria-hidden="true"></span>
          <div data-ok-map-popup-content data-ok-paper>Paris, the capital of France.</div>
          <button type="button" data-ok-map-popup-close aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
        </div>
        <div data-ok-map-source data-ok-id="cities" data-ok-type="geojson" data-ok-data='{"type":"Feature","properties":{},"geometry":{"type":"Point","coordinates":[4.84,45.76]}}' hidden>
          <div data-ok-map-layer data-ok-id="cities" data-ok-type="circle" data-ok-paint='{"circle-radius":6,"circle-color":"var(--ok-palette-info-main)"}' hidden></div>
        </div>
        <div data-ok-map-corner="top-left"></div>
        <div data-ok-map-corner="top-right"></div>
        <div data-ok-map-corner="bottom-left">
          <div data-ok-map-control data-ok-paper data-ok-map-navigation>
            <button type="button" data-ok-map-action="zoom-in" aria-label="Zoom in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"></path></svg></button>
            <button type="button" data-ok-map-action="zoom-out" aria-label="Zoom out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M5 12h14"></path></svg></button>
          </div>
          <div data-ok-map-scale data-ok-unit="metric"></div>
        </div>
        <div data-ok-map-corner="bottom-right">
          <details data-ok-map-attribution>
            <summary aria-label="Map credits"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18ZM12 11v5M12 8h.01"></path></svg></summary>
            <div data-ok-map-attribution-text></div>
          </details>
        </div>
      </div>
    </main>
  </body>
</html>
